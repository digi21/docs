<svg xmlns="http://www.w3.org/2000/svg" width="480" height="434" viewBox="0 0 480 434" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>  <rect width="480" height="434" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">2P_AA</text>

  <g transform="translate(100,30)">
    <polygon points="50,200 227.6,135.4 200,60 22.4,124.6" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="50" y1="200" x2="200" y2="60" stroke="#888" stroke-dasharray="5 4"/>
    <line x1="50" y1="200" x2="160" y2="200" stroke="#e67e22" stroke-dasharray="4 3"/>
    <path d="M 110 200 A 60 60 0 0 0 106.4 179.5" fill="none" stroke="#e67e22" stroke-width="2"/>
    <text x="116" y="196" fill="#e67e22" font-weight="bold">AA</text>
    <text x="164" y="204" fill="#e67e22">eje X</text>
    <use href="#p1" x="50" y="200"/>
    <use href="#p2" x="200" y="60"/>
  </g>
  <text x="240" y="284" text-anchor="middle" fill="#222">1 y 2: esquinas opuestas (la diagonal). Los lados siguen la</text>
  <text x="240" y="300" text-anchor="middle" fill="#222">dirección del ángulo activo AA al digitalizar el punto 2.</text>

  <rect x="16" y="320" width="448" height="100" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="52" y="337"/>
