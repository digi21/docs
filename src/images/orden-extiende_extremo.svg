<svg xmlns="http://www.w3.org/2000/svg" width="480" height="456" viewBox="0 0 480 456" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
  </defs>
  <rect width="480" height="456" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">EXTIENDE_EXTREMO</text>

  <polyline points="60,225 150,150 230,130" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="230" y1="130" x2="357" y2="98.2" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="350" y1="70" x2="357" y2="98.2" stroke="#555" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="357" cy="98.2" r="6" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <g stroke="#c0392b" stroke-width="2"><line x1="340" y1="70" x2="360" y2="70"/><line x1="350" y1="60" x2="350" y2="80"/></g>
  <text x="366" y="66" fill="#c0392b">cursor</text>
  <use href="#p1" x="200" y="137.5"/>

  <text x="240" y="266" text-anchor="middle" fill="#222">1: la línea, junto al extremo que se prolonga.</text>
  <text x="240" y="284" text-anchor="middle" fill="#222">Al mover el cursor, la prolongación sigue la dirección</text>
  <text x="240" y="302" text-anchor="middle" fill="#222">del último tramo. Con el botón de dato se añade</text>
  <text x="240" y="320" text-anchor="middle" fill="#222">un vértice en el pie de la perpendicular trazada</text>
  <text x="240" y="338" text-anchor="middle" fill="#222">desde el cursor, con la Z del cursor.</text>

  <rect x="16" y="360" width="448" height="84" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="378"/>
  <text x="60" y="382" fill="#222">Selección.</text>
  <line x1="250" y1="378" x2="286" y2="378" stroke="#1f5fa8" stroke-width="3"/>
  <text x="294" y="382" fill="#222">Línea.</text>
  <line x1="26" y1="400" x2="62" y2="400" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="70" y="404" fill="#222">Prolongación que se añade.</text>
  <circle cx="268" cy="400" r="6" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="294" y="404" fill="#222">Vértice nuevo.</text>
  <g stroke="#c0392b" stroke-width="2"><line x1="34" y1="422" x2="54" y2="422"/><line x1="44" y1="412" x2="44" y2="432"/></g>
  <text x="70" y="426" fill="#222">Cursor.</text>
  <line x1="250" y1="422" x2="286" y2="422" stroke="#555" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="294" y="426" fill="#222">Perpendicular al tramo.</text>
</svg>
