<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="480" height="380" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">CUADROS (3 × 4)</text>

  <g stroke="#1f5fa8" stroke-width="2">
    <line x1="90" y1="240" x2="390" y2="240"/><line x1="90" y1="180" x2="390" y2="180"/>
    <line x1="90" y1="120" x2="390" y2="120"/><line x1="90" y1="60" x2="390" y2="60"/>
    <line x1="90" y1="60" x2="90" y2="240"/><line x1="165" y1="60" x2="165" y2="240"/>
    <line x1="240" y1="60" x2="240" y2="240"/><line x1="315" y1="60" x2="315" y2="240"/>
    <line x1="390" y1="60" x2="390" y2="240"/>
  </g>
  <use href="#p1" x="90" y="240"/>
  <use href="#p2" x="390" y="240"/>
  <use href="#p3" x="255" y="60"/>

  <text x="240" y="278" text-anchor="middle" fill="#222">1-2: la base. 3: un punto del lado opuesto. La orden pide en</text>
  <text x="240" y="295" text-anchor="middle" fill="#222">la barra de estado cuántas divisiones paralelas a la base (3)</text>
  <text x="240" y="312" text-anchor="middle" fill="#222">y cuántas perpendiculares (4), y traza la rejilla.</text>

  <rect x="15" y="334" width="450" height="34" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="34" y="351"/>
  <text x="50" y="356" fill="#222">Puntos digitalizados, en orden.</text>
</svg>
