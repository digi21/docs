<svg xmlns="http://www.w3.org/2000/svg" width="500" height="474" viewBox="0 0 500 474" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="500" height="474" fill="#ffffff"/>
  <text x="250" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">ESTIRA_RECORTA_POR_TOLERANCIA</text>

  <line x1="40" y1="200" x2="460" y2="200" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="130" y1="70" x2="130" y2="180" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="130" y1="180" x2="130" y2="200" stroke="#e67e22" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="106" y="156" width="48" height="48" fill="none" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="300" y1="70" x2="300" y2="200" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="300" y1="200" x2="300" y2="218" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="276" y="194" width="48" height="48" fill="none" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="400" y1="200" x2="412" y2="182" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="418" y="180" fill="#c0392b">rabillo</text>
  <text x="162" y="172" fill="#777">ventana ± tolerancia</text>

  <text x="250" y="276" text-anchor="middle" fill="#222">Orden inmediata. Parámetro 1: tolerancia.</text>
  <text x="250" y="294" text-anchor="middle" fill="#222">Cada extremo libre de una línea visible que queda a</text>
  <text x="250" y="312" text-anchor="middle" fill="#222">menos de la tolerancia de otra línea se lleva sobre</text>
  <text x="250" y="330" text-anchor="middle" fill="#222">esa línea; solo cambian su X y su Y.</text>
  <text x="250" y="348" text-anchor="middle" fill="#222">Las líneas de dos vértices con un extremo libre y</text>
  <text x="250" y="366" text-anchor="middle" fill="#222">más cortas que la tolerancia se borran.</text>

  <rect x="16" y="388" width="468" height="74" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="26" y1="406" x2="62" y2="406" stroke="#1f5fa8" stroke-width="3"/>
  <text x="70" y="410" fill="#222">Líneas.</text>
  <line x1="250" y1="406" x2="286" y2="406" stroke="#e67e22" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="294" y="410" fill="#222">Tramo que se añade.</text>
  <line x1="26" y1="428" x2="62" y2="428" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="70" y="432" fill="#222">Parte que se elimina.</text>
  <rect x="256" y="420" width="24" height="16" fill="none" stroke="#999" stroke-dasharray="3 3"/>
  <text x="294" y="432" fill="#222">Ventana alrededor de un</text>
  <text x="294" y="450" fill="#222">extremo libre.</text>
</svg>
