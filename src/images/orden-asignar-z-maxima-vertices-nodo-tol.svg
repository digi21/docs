<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="nodo"><circle r="6.5" fill="#fff" stroke="#222" stroke-width="2"/></g>
  </defs>
  <rect width="480" height="490" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ASIGNAR_Z_MAXIMA_VERTICES_NODO_TOL</text>
  <text x="240" y="52" text-anchor="middle" fill="#555" font-size="12">tolerancia en Z = 1</text>

  <polyline points="60,70 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="420,90 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="180,330 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <use href="#nodo" x="240" y="170"/>

  <text x="122" y="80" fill="#555" font-size="12">z 100 (no cambia)</text>
  <text x="300" y="172" fill="#d35400" font-size="12">z 101,5 → 102</text>
  <text x="232" y="262" fill="#555" font-size="12">z 102 (máxima)</text>

  <text x="240" y="364" text-anchor="middle" fill="#222">Nodo: punto donde coinciden en X e Y los extremos de dos</text>
  <text x="240" y="382" text-anchor="middle" fill="#222">o más líneas o polígonos de los códigos indicados.</text>
  <text x="240" y="400" text-anchor="middle" fill="#222">Solo los extremos cuya Z está a menos de la tolerancia de</text>
  <text x="240" y="418" text-anchor="middle" fill="#222">la Z máxima toman esa Z: 101,5 pasa a 102; 100 no cambia.</text>

  <rect x="16" y="436" width="448" height="42" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#nodo" x="36" y="457"/>
  <text x="50" y="461" fill="#222">Nodo.</text>
  <text x="140" y="461" fill="#d35400" font-size="12">z antes → z después</text>
  <text x="262" y="461" fill="#222">Z del extremo que cambia.</text>
</svg>
