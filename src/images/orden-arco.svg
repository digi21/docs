<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="440" height="300" fill="#ffffff"/>

  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ARCO</text>

  <g transform="translate(60,0)">
    <path d="M 75.4 149.2 A 90 90 0 0 1 244.6 149.2" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#p1" x="75.4" y="149.2"/>
    <use href="#p2" x="160" y="90"/>
    <use href="#p3" x="244.6" y="149.2"/>
  </g>

  <text x="220" y="196" text-anchor="middle" fill="#222">1: inicio. 2: punto intermedio. 3: final.</text>
  <text x="220" y="212" text-anchor="middle" fill="#222">Con una línea en curso, el punto 1 es su último</text>
  <text x="220" y="228" text-anchor="middle" fill="#222">vértice y el arco se añade a esa línea.</text>

  <rect x="20" y="248" width="400" height="42" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="269"/>
  <text x="56" y="274" fill="#222">Puntos digitalizados, en orden.</text>
  <line x1="252" y1="269" x2="282" y2="269" stroke="#1f5fa8" stroke-width="3"/>
  <text x="290" y="274" fill="#222">Arco.</text>
</svg>
