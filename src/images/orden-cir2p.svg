<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="440" height="320" fill="#ffffff"/>

  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CIR2P</text>

  <g transform="translate(60,5)">
    <circle cx="160" cy="125" r="80" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="160" y1="125" x2="229.3" y2="85" stroke="#888" stroke-dasharray="5 4"/>
    <text x="180" y="96" fill="#555">radio</text>
    <use href="#p1" x="160" y="125"/>
    <use href="#p2" x="229.3" y="85"/>
  </g>

  <text x="220" y="236" text-anchor="middle" fill="#222">1: centro. 2: un punto de la circunferencia.</text>
  <text x="220" y="252" text-anchor="middle" fill="#222">El radio es la distancia 1-2 en el plano de la cámara.</text>

  <rect x="20" y="268" width="400" height="42" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="289"/>
  <text x="56" y="294" fill="#222">Puntos digitalizados, en orden.</text>
  <circle cx="262" cy="289" r="9" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
  <text x="278" y="294" fill="#222">Línea cerrada creada.</text>
</svg>
