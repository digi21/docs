<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="p2"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text></g>
    <g id="viejo"><circle r="4" fill="#fff" stroke="#999" stroke-width="1.5"/></g>
    <g id="nuevo"><circle r="4.5" fill="#e67e22"/></g>
    <g id="cruz" stroke="#c0392b" stroke-width="2"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/></g>
  </defs>
  <rect width="840" height="600" fill="#ffffff"/>

  <!-- ALINEAR -->
  <g transform="translate(0,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ALINEAR</text>
    <polygon points="20,105 190,85 190,115 20,135" fill="#f6e7d8" stroke="none"/>
    <line x1="20" y1="120" x2="190" y2="100" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="196" y="90" fill="#b07030">DA</text>
    <line x1="50" y1="180" x2="50" y2="116.5" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="100" y1="40" x2="100" y2="110.6" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="150" y1="180" x2="150" y2="104.7" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#viejo" x="50" y="128"/><use href="#viejo" x="100" y="99"/><use href="#viejo" x="150" y="113"/>
    <use href="#nuevo" x="50" y="116.5"/><use href="#nuevo" x="100" y="110.6"/><use href="#nuevo" x="150" y="104.7"/>
    <use href="#p1" x="20" y="120"/><use href="#p2" x="190" y="100"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">1-2: línea virtual. Los vértices a</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">menos de DA de ella se proyectan</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">sobre ella.</text>
  </g>

  <!-- JUNTAR -->
  <g transform="translate(210,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">JUNTAR</text>
    <circle cx="110" cy="105" r="24" fill="none" stroke="#999" stroke-dasharray="3 3"/>
    <text x="140" y="80" fill="#777">cursor</text>
    <polyline points="30,60 110,105" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="190,85 110,105" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="80,180 110,105" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#viejo" x="98" y="96"/><use href="#viejo" x="124" y="100"/><use href="#viejo" x="106" y="122"/>
    <use href="#cruz" x="110" y="105"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">Los vértices que quedan dentro del</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">cursor se mueven a la X e Y del punto</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">digitalizado. El parámetro fija el</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">tamaño del cursor.</text>
  </g>

  <!-- JUNTAR_Z -->
  <g transform="translate(420,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">JUNTAR_Z</text>
    <circle cx="110" cy="105" r="24" fill="none" stroke="#999" stroke-dasharray="3 3"/>
    <polyline points="30,60 100,97" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="190,85 124,101" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="80,180 106,122" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#nuevo" x="100" y="97"/><use href="#nuevo" x="124" y="101"/><use href="#nuevo" x="106" y="122"/>
    <use href="#cruz" x="112" y="108"/>
    <text x="10" y="120" fill="#555" font-size="11">z 101 → 102</text>
    <text x="150" y="120" fill="#555" font-size="11">z 99 → 102</text>
    <text x="114" y="148" fill="#555" font-size="11">z 104 → 102</text>
    <text x="105" y="205" text-anchor="middle" fill="#222">Igual que JUNTAR, pero solo cambia</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">la Z: los vértices del cursor toman la</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">Z del punto digitalizado (aquí 102).</text>
  </g>

  <!-- JUNTAR_VERTICES_CERCANOS -->
  <g transform="translate(630,0)">
    <text x="105" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">JUNTAR_VERTICES_CERCANOS</text>
    <polyline points="30,60 100,105 108,170" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="185,55 106,111 190,170" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="30,60 100,105 100,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="185,55 100,105 190,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#viejo" x="106" y="111"/><use href="#viejo" x="108" y="170"/>
    <use href="#nuevo" x="100" y="105"/><use href="#nuevo" x="100" y="170"/>
    <text x="114" y="185" fill="#555" font-size="11">X 100,03 → 100</text>
    <text x="105" y="205" text-anchor="middle" fill="#222">Pide una distancia. En el archivo</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">activo, cada X a menos de esa distancia</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">de una X anterior toma su valor; igual</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">con la Y. X e Y se ajustan por separado.</text>
  </g>

  <line x1="20" y1="268" x2="820" y2="268" stroke="#ddd"/>

  <!-- ELIMINAR_SEGMENTOS_CORTOS -->
  <g transform="translate(0,278)">
    <text x="105" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ELIMINAR_SEGMENTOS_CORTOS</text>
    <polyline points="20,150 90,100 98,96" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="20,150 90,100 190,80" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="98,96 140,170" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <polyline points="90,100 140,170" fill="none" stroke="#2e7d32" stroke-width="3"/>
    <use href="#viejo" x="98" y="96"/>
    <use href="#nuevo" x="90" y="100"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">Elimina el vértice que forma un</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">tramo más corto que el indicado. Las</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">entidades con ese vértice (verde)</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">pasan al vértice que se conserva.</text>
  </g>

  <!-- ASIGNAR_Z_MAXIMA_VERTICES_NODO_TOL -->
  <g transform="translate(210,278)">
    <text x="105" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ASIGNAR_Z_MAXIMA_</text>
    <text x="105" y="29" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">VERTICES_NODO_TOL (TOL = 1)</text>
    <polyline points="25,60 110,105" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="195,70 110,105" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="80,180 110,105" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#nuevo" x="110" y="105"/>
    <text x="5" y="128" fill="#555" font-size="11">z 100 (no cambia)</text>
    <text x="130" y="62" fill="#555" font-size="11">z 101,5 → 102</text>
    <text x="100" y="160" fill="#555" font-size="11">z 102</text>
    <text x="105" y="205" text-anchor="middle" fill="#222">Nodo: extremos de líneas con la</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">misma XY. Los extremos a menos de</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">TOL de la Z máxima toman la máxima.</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">Sin _TOL: todos los extremos.</text>
  </g>

  <!-- RET -->
  <g transform="translate(420,278)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RET</text>
    <polyline points="40,60 170,60" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="40,85 170,85 170,170 40,170" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="40,85 40,60 170,60 170,85" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 3"/>
    <line x1="185" y1="60" x2="185" y2="85" stroke="#555" stroke-width="1.2"/>
    <text x="190" y="77" fill="#555">d</text>
    <use href="#p1" x="105" y="60"/>
    <use href="#cruz" x="105" y="130"/>
    <text x="114" y="146" fill="#c0392b">lado</text>
    <text x="105" y="205" text-anchor="middle" fill="#222">Indica d, selecciona el tramo (1)</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">y pincha a un lado. Dentro: el tramo</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">entra d y se añade el alero (verde)</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">con el código activo. Fuera: solo alero.</text>
  </g>

  <!-- AJUSTA_AREA -->
  <g transform="translate(630,278)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">AJUSTA_AREA</text>
    <polygon points="40,170 40,70 130,55 165,170" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="40,170 40,70 152.3,51.3 190,170" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="152.3" y1="51.3" x2="190" y2="170" stroke="#e67e22" stroke-width="4"/>
    <use href="#p1" x="148" y="112"/>
    <text x="100" y="125" text-anchor="middle" fill="#1f5fa8">área deseada</text>
    <text x="105" y="205" text-anchor="middle" fill="#222">1: tramo de una línea cerrada. Escribe</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">el área: el tramo se desplaza, por</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">iteraciones, hasta que el área coincide.</text>
  </g>

  <rect x="20" y="548" width="800" height="46" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#viejo" x="38" y="563"/>
  <text x="50" y="567" fill="#222">Posición original del vértice.</text>
  <use href="#nuevo" x="250" y="563"/>
  <text x="262" y="567" fill="#222">Posición o Z nueva.</text>
  <use href="#cruz" x="430" y="563"/>
  <text x="444" y="567" fill="#222">Punto digitalizado.</text>
  <use href="#p1" x="600" y="563"/>
  <text x="614" y="567" fill="#222">Punto de selección.</text>
  <text x="38" y="586" fill="#222">Líneas discontinuas grises: la geometría antes de la orden.</text>
</svg>
