<svg xmlns="http://www.w3.org/2000/svg" width="840" height="850" viewBox="0 0 840 850" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="p2"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text></g>
    <g id="p3"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text></g>
    <g id="cruz" stroke="#c0392b" stroke-width="2"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/></g>
  </defs>
  <rect width="840" height="850" fill="#ffffff"/>

  <!-- TRIM -->
  <g transform="translate(0,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">TRIM</text>
    <line x1="120" y1="40" x2="120" y2="170" stroke="#444" stroke-width="3"/>
    <line x1="20" y1="105" x2="120" y2="105" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="120" y1="105" x2="195" y2="105" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
    <use href="#p1" x="120" y="60"/>
    <use href="#p2" x="165" y="105"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: límite. 2: línea, sobre el trozo</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">que quieres quitar. Se parte en los</text>
    <text x="105" y="225" text-anchor="middle" fill="#222">cruces con el límite y se elimina el</text>
    <text x="105" y="240" text-anchor="middle" fill="#222">trozo seleccionado.</text>
  </g>

  <!-- TRIM_LADO -->
  <g transform="translate(210,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">TRIM_LADO</text>
    <line x1="110" y1="40" x2="110" y2="170" stroke="#444" stroke-width="3"/>
    <g stroke="#1f5fa8" stroke-width="3"><line x1="25" y1="70" x2="110" y2="70"/><line x1="25" y1="105" x2="110" y2="105"/><line x1="25" y1="140" x2="110" y2="140"/></g>
    <g stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"><line x1="110" y1="70" x2="190" y2="70"/><line x1="110" y1="105" x2="185" y2="105"/><line x1="110" y1="140" x2="195" y2="140"/></g>
    <use href="#p1" x="110" y="50"/>
    <use href="#cruz" x="165" y="165"/>
    <text x="176" y="169" fill="#c0392b">lado</text>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: límite. Después digitaliza un punto:</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">de todas las líneas que cruzan el</text>
    <text x="105" y="225" text-anchor="middle" fill="#222">límite se elimina lo que queda en</text>
    <text x="105" y="240" text-anchor="middle" fill="#222">ese lado.</text>
  </g>

  <!-- TRIM_M -->
  <g transform="translate(420,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">TRIM_M</text>
    <line x1="100" y1="40" x2="100" y2="170" stroke="#444" stroke-width="3"/>
    <g stroke="#1f5fa8" stroke-width="3"><line x1="20" y1="70" x2="100" y2="70"/><line x1="20" y1="105" x2="100" y2="105"/><line x1="20" y1="140" x2="100" y2="140"/></g>
    <g stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"><line x1="100" y1="70" x2="190" y2="70"/><line x1="100" y1="105" x2="185" y2="105"/><line x1="100" y1="140" x2="195" y2="140"/></g>
    <line x1="155" y1="50" x2="155" y2="160" stroke="#555" stroke-width="1.5" stroke-dasharray="6 3"/>
    <use href="#p1" x="100" y="50"/>
    <use href="#p2" x="155" y="50"/>
    <use href="#p3" x="155" y="160"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: límite. 2, 3…: un límite virtual.</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">En cada línea que cruza el límite</text>
    <text x="105" y="225" text-anchor="middle" fill="#222">virtual se elimina el trozo por el</text>
    <text x="105" y="240" text-anchor="middle" fill="#222">que pasa.</text>
  </g>

  <!-- CRUCE -->
  <g transform="translate(630,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CRUCE</text>
    <line x1="15" y1="110" x2="60" y2="110" stroke="#444" stroke-width="3"/>
    <line x1="60" y1="110" x2="150" y2="110" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
    <line x1="150" y1="110" x2="195" y2="110" stroke="#444" stroke-width="3"/>
    <line x1="60" y1="40" x2="60" y2="95" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="60" y1="95" x2="60" y2="110" stroke="#e67e22" stroke-width="3" stroke-dasharray="4 3"/>
    <line x1="150" y1="40" x2="150" y2="110" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="150" y1="110" x2="150" y2="130" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
    <use href="#p1" x="30" y="110"/>
    <use href="#p2" x="60" y="65"/>
    <use href="#p3" x="150" y="65"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: borde. 2 y 3: dos líneas que</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">llegan a él. Se estiran o recortan</text>
    <text x="105" y="225" text-anchor="middle" fill="#222">hasta el borde, y el tramo del borde</text>
    <text x="105" y="240" text-anchor="middle" fill="#222">entre los dos cortes se elimina.</text>
  </g>

  <line x1="20" y1="262" x2="820" y2="262" stroke="#ddd"/>

  <!-- CORTAR_E -->
  <g transform="translate(0,272)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CORTAR_E</text>
    <polyline points="20,150 80,90 130,99.1" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="130,99.1 190,110" fill="none" stroke="#2e7d32" stroke-width="3"/>
    <circle cx="130" cy="99.1" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
    <use href="#p1" x="130" y="80"/>
    <line x1="130" y1="88" x2="130" y2="94" stroke="#c0392b" stroke-width="2"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: punto de la línea. La línea se</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">parte en dos en ese punto.</text>
  </g>

  <!-- CORTAR_Y_BORRAR -->
  <g transform="translate(210,272)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CORTAR_Y_BORRAR</text>
    <polyline points="20,150 80,90 130,99.1" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="130,99.1 190,110" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
    <circle cx="130" cy="99.1" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
    <use href="#p1" x="130" y="80"/>
    <use href="#p2" x="168" y="128"/>
    <line x1="168" y1="120" x2="166" y2="108" stroke="#c0392b" stroke-width="2"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: punto donde se parte la línea.</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">2: el trozo que se borra.</text>
  </g>

  <!-- CORTA_2P -->
  <g transform="translate(420,272)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CORTA_2P</text>
    <polyline points="20,150 50,120" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="50,120 80,90 150,102.7" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
    <polyline points="150,102.7 190,110" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#p1" x="50" y="120"/>
    <use href="#p2" x="150" y="102.7"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1 y 2: dos puntos de la línea. El</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">tramo entre ellos se borra y quedan</text>
    <text x="105" y="225" text-anchor="middle" fill="#222">dos líneas.</text>
  </g>

  <!-- CORTAR_POLIGONO -->
  <g transform="translate(630,272)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CORTAR_POLIGONO</text>
    <polygon points="30,50 93.75,50 116.25,170 30,170" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
    <polygon points="93.75,50 180,50 180,170 116.25,170" fill="#dcefdc" stroke="#2e7d32" stroke-width="2"/>
    <line x1="90" y1="30" x2="120" y2="190" stroke="#444" stroke-width="2"/>
    <use href="#p1" x="55" y="140"/>
    <use href="#p2" x="116.9" y="172"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">1: polígono. 2: línea de corte. El</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">polígono se divide en varios, con su</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">mismo código.</text>
  </g>

  <line x1="20" y1="534" x2="820" y2="534" stroke="#ddd"/>

  <!-- RECORTAR_POLIGONO -->
  <g transform="translate(210,544)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RECORTAR_POLIGONO</text>
    <rect x="25" y="55" width="160" height="110" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
    <circle cx="140" cy="110" r="40" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
    <circle cx="140" cy="110" r="40" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 3"/>
    <use href="#p1" x="50" y="80"/>
    <use href="#p2" x="140" y="70"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: polígono. 2: límite cerrado. Se</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">elimina del polígono la parte que</text>
    <text x="105" y="225" text-anchor="middle" fill="#222">queda dentro del límite.</text>
  </g>

  <!-- RECORTAR_POLIGONOS -->
  <g transform="translate(420,544)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RECORTAR_POLIGONOS</text>
    <rect x="20" y="60" width="80" height="100" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
    <rect x="110" y="60" width="80" height="100" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
    <circle cx="105" cy="110" r="40" fill="#ffffff" stroke="none"/>
    <circle cx="105" cy="110" r="40" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 3"/>
    <use href="#p1" x="105" y="70"/>
    <text x="105" y="195" text-anchor="middle" fill="#222">1: límite cerrado. Se recortan a la</text>
    <text x="105" y="210" text-anchor="middle" fill="#222">vez todos los polígonos visibles</text>
    <text x="105" y="225" text-anchor="middle" fill="#222">que lo cortan.</text>
  </g>

  <rect x="20" y="785" width="800" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="38" y="800"/>
  <text x="52" y="804" fill="#222">Puntos de selección o digitalizados, en orden.</text>
  <line x1="330" y1="800" x2="370" y2="800" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="378" y="804" fill="#222">Parte que se elimina.</text>
  <line x1="560" y1="800" x2="600" y2="800" stroke="#444" stroke-width="3"/>
  <text x="608" y="804" fill="#222">Límite o línea de corte.</text>
  <text x="38" y="830" fill="#222">En las tres órdenes de polígonos, con cualquier parámetro se borra además la línea de corte o el límite.</text>
</svg>
