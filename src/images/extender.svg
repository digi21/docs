<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="p2"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text></g>
    <g id="p3"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text></g>
  </defs>
  <rect width="840" height="600" fill="#ffffff"/>

  <!-- EXT -->
  <g transform="translate(0,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">EXT</text>
    <line x1="150" y1="40" x2="150" y2="180" stroke="#444" stroke-width="3"/>
    <text x="156" y="176" fill="#444">límite</text>
    <line x1="20" y1="80" x2="110" y2="80" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="110" y1="80" x2="150" y2="80" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="20" y1="140" x2="150" y2="140" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="150" y1="140" x2="190" y2="140" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
    <use href="#p1" x="150" y="55"/>
    <use href="#p2" x="95" y="80"/>
    <use href="#p3" x="125" y="140"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">1: límite. 2, 3…: líneas que se</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">estiran (2) o recortan (3) por el</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">extremo más cercano a la selección.</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">Las Z de los extremos no cambian.</text>
  </g>

  <!-- EXT_P -->
  <g transform="translate(210,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">EXT_P</text>
    <line x1="150" y1="40" x2="150" y2="77" stroke="#444" stroke-width="3"/>
    <line x1="150" y1="83" x2="150" y2="180" stroke="#2e7d32" stroke-width="3"/>
    <line x1="20" y1="80" x2="110" y2="80" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="110" y1="80" x2="150" y2="80" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="150" cy="80" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="158" y="100" fill="#222">nodo</text>
    <use href="#p1" x="150" y="140"/>
    <use href="#p2" x="95" y="80"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">Como EXT, para una sola línea, y</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">además el límite se parte en dos</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">en el punto de corte.</text>
  </g>

  <!-- EXT_XYZ -->
  <g transform="translate(420,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">EXT_XYZ</text>
    <line x1="150" y1="40" x2="150" y2="180" stroke="#444" stroke-width="3"/>
    <text x="156" y="50" fill="#444">z = 110</text>
    <text x="156" y="176" fill="#444">z = 100</text>
    <line x1="20" y1="110" x2="110" y2="110" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="110" y1="110" x2="150" y2="110" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="150" cy="110" r="5" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <text x="146" y="128" fill="#e67e22" text-anchor="end">z = 105</text>
    <use href="#p1" x="150" y="150"/>
    <use href="#p2" x="95" y="110"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">Como EXT, pero el extremo</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">estirado toma la Z del límite en el</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">punto de corte.</text>
  </g>

  <!-- EXT2X -->
  <g transform="translate(630,0)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">EXT2X</text>
    <line x1="20" y1="170" x2="80" y2="127.1" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="200" y1="170" x2="140" y2="127.1" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="80,127.1 110,105.7 140,127.1" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
    <use href="#p1" x="60" y="141.4"/>
    <use href="#p2" x="160" y="141.4"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">Prolonga las dos líneas por los</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">extremos más cercanos a la selección</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">hasta que se cortan. Si tienen el</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">mismo código, las une.</text>
  </g>

  <line x1="20" y1="270" x2="820" y2="270" stroke="#ddd"/>

  <!-- EXT_M -->
  <g transform="translate(0,280)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">EXT_M</text>
    <line x1="160" y1="40" x2="160" y2="180" stroke="#444" stroke-width="3"/>
    <g stroke="#1f5fa8" stroke-width="3"><line x1="20" y1="60" x2="100" y2="60"/><line x1="20" y1="95" x2="115" y2="95"/><line x1="20" y1="130" x2="90" y2="130"/><line x1="20" y1="165" x2="105" y2="165"/></g>
    <g stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"><line x1="100" y1="60" x2="160" y2="60"/><line x1="115" y1="95" x2="160" y2="95"/><line x1="90" y1="130" x2="160" y2="130"/><line x1="105" y1="165" x2="160" y2="165"/></g>
    <line x1="70" y1="45" x2="70" y2="180" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <use href="#p1" x="160" y="112"/>
    <use href="#p2" x="70" y="45"/>
    <use href="#p3" x="70" y="180"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">1: límite. 2 y 3: dos puntos. Se</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">estiran todas las líneas visibles que</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">cruzan el segmento 2-3.</text>
  </g>

  <!-- EXTIENDE_EXTREMO -->
  <g transform="translate(210,280)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">EXTIENDE_EXTREMO</text>
    <polyline points="20,170 70,120 110,110" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="110" y1="110" x2="180.6" y2="92.3" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="175" y1="70" x2="180.6" y2="92.3" stroke="#555" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="180.6" cy="92.3" r="5" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <g stroke="#c0392b" stroke-width="2"><line x1="167" y1="70" x2="183" y2="70"/><line x1="175" y1="62" x2="175" y2="78"/></g>
    <text x="160" y="58" fill="#c0392b">cursor</text>
    <use href="#p1" x="95" y="114"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">1: la línea, junto al extremo. Se añade</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">un vértice que prolonga el último tramo</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">hasta el pie de la perpendicular desde</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">el cursor, con la Z del cursor.</text>
  </g>

  <!-- EXT_PLANO -->
  <g transform="translate(420,280)">
    <text x="105" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">EXT_PLANO</text>
    <polygon points="130,40 190,60 190,190 130,170" fill="#f1f1f1" stroke="#999"/>
    <text x="160" y="185" text-anchor="middle" fill="#777">plano</text>
    <polyline points="20,150 70,120 100,110" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="100" y1="110" x2="145" y2="95" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="145" cy="95" r="5" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <use href="#p1" x="160" y="140"/>
    <use href="#p2" x="85" y="115"/>
    <text x="105" y="205" text-anchor="middle" fill="#222">1: entidad cuyos tres primeros vértices</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">definen el plano. 2: línea; su extremo</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">se prolonga en 3D, siguiendo el último</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">tramo, hasta el plano.</text>
  </g>

  <!-- ESTIRA_RECORTA_POR_TOLERANCIA -->
  <g transform="translate(630,280)">
    <text x="105" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ESTIRA_RECORTA_POR_TOL…</text>
    <line x1="20" y1="150" x2="190" y2="150" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="60" y1="50" x2="60" y2="138" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="60" y1="138" x2="60" y2="150" stroke="#e67e22" stroke-width="3" stroke-dasharray="4 3"/>
    <line x1="140" y1="50" x2="140" y2="150" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="140" y1="150" x2="140" y2="164" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
    <circle cx="60" cy="138" r="18" fill="none" stroke="#999" stroke-dasharray="3 3"/>
    <circle cx="140" cy="164" r="18" fill="none" stroke="#999" stroke-dasharray="3 3"/>
    <text x="84" y="128" fill="#777">tolerancia</text>
    <text x="105" y="205" text-anchor="middle" fill="#222">Los extremos de las líneas visibles que</text>
    <text x="105" y="220" text-anchor="middle" fill="#222">quedan a menos de la tolerancia de</text>
    <text x="105" y="235" text-anchor="middle" fill="#222">otra línea se estiran o se recortan</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">hasta tocarla.</text>
  </g>

  <rect x="20" y="548" width="800" height="46" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="38" y="563"/>
  <text x="52" y="567" fill="#222">Puntos de selección o digitalizados, en orden.</text>
  <line x1="330" y1="563" x2="370" y2="563" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="378" y="567" fill="#222">Prolongación que se añade.</text>
  <line x1="560" y1="563" x2="600" y2="563" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="608" y="567" fill="#222">Parte que se recorta.</text>
  <line x1="30" y1="584" x2="70" y2="584" stroke="#444" stroke-width="3"/>
  <text x="78" y="588" fill="#222">Línea límite.</text>
</svg>
