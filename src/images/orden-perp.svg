<svg xmlns="http://www.w3.org/2000/svg" width="480" height="664" viewBox="0 0 480 664" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="eje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="tramo">
      <line x1="30" y1="190" x2="170" y2="190" stroke="#1f5fa8" stroke-width="4"/>
      <line x1="170" y1="190" x2="265" y2="190" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="30" cy="190" r="4" fill="#1f5fa8"/><circle cx="170" cy="190" r="4" fill="#1f5fa8"/>
      <text x="100" y="210" text-anchor="middle" fill="#1f5fa8">tramo seleccionado</text>
      <text x="218" y="210" text-anchor="middle" fill="#1f5fa8" font-size="12">prolongación</text>
    </g>
  </defs>  <rect width="480" height="664" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">PERP</text>

  <text x="20" y="56" font-weight="bold" fill="#555">Planta</text>
  <g transform="translate(90,20)">
    <use href="#tramo"/>
    <polyline points="110,190 110,90" fill="none" stroke="#e67e22" stroke-width="3"/>
    <polyline points="110,90 200,55 250,80" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="7 5"/>
    <polyline points="110,178 122,178 122,190" fill="none" stroke="#555"/>
    <circle cx="110" cy="190" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <text x="96" y="182" fill="#555" text-anchor="end">pie</text>
    <use href="#p1" x="110" y="90"/>
    <text x="210" y="44" fill="#e67e22">sigue con LINEA</text>
  </g>
  <text x="240" y="262" text-anchor="middle" fill="#222">Selecciona el tramo y digitaliza el punto 1. La orden empieza una</text>
  <text x="240" y="278" text-anchor="middle" fill="#222">polilínea con LINEA: primer vértice en el pie de la perpendicular</text>
  <text x="240" y="294" text-anchor="middle" fill="#222">(puede caer en la prolongación), segundo vértice en 1.</text>
  <line x1="16" y1="316" x2="464" y2="316" stroke="#ddd"/>
  <text x="20" y="340" font-weight="bold" fill="#555">Alzado del segmento perpendicular</text>
  <line x1="120" y1="462" x2="120" y2="352" stroke="#777" stroke-width="1.2" marker-end="url(#eje)"/>
  <text x="128" y="362" fill="#777">Z</text>
  <line x1="170" y1="440" x2="170" y2="375" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="170" cy="440" r="5" fill="#1f5fa8"/>
  <text x="180" y="452" fill="#1f5fa8">tramo</text>
  <line x1="170" y1="375" x2="330" y2="375" stroke="#e67e22" stroke-width="3"/>
  <circle cx="170" cy="375" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="160" y="372" fill="#555" text-anchor="end">pie</text>
  <use href="#p1" x="330" y="375"/>
  <text x="240" y="484" text-anchor="middle" fill="#222">El pie toma la Z del punto 1.</text>

  <rect x="16" y="506" width="448" height="144" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="32" y1="523" x2="72" y2="523" stroke="#1f5fa8" stroke-width="4"/>
  <text x="86" y="527.5" fill="#222">Tramo seleccionado (discontinuo: su prolongación).</text>
  <use href="#p1" x="52" y="545"/>
  <text x="86" y="549.5" fill="#222">Punto digitalizado.</text>
  <line x1="32" y1="567" x2="72" y2="567" stroke="#e67e22" stroke-width="3"/>
  <text x="86" y="571.5" fill="#222">Primer segmento de la polilínea.</text>
  <line x1="32" y1="589" x2="72" y2="589" stroke="#e67e22" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="86" y="593.5" fill="#222">Vértices que se siguen digitalizando con LINEA.</text>
  <circle cx="52" cy="611" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="86" y="615.5" fill="#222">Pie de la perpendicular.</text>
  <circle cx="52" cy="633" r="5" fill="#1f5fa8"/>
  <text x="86" y="637.5" fill="#222">Tramo en el alzado (se ve como un punto).</text>
</svg>
