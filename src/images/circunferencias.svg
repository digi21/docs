<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="640" height="590" fill="#ffffff"/>

  <!-- CIR2P -->
  <g transform="translate(0,0)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CIR2P</text>
    <circle cx="160" cy="125" r="80" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="160" y1="125" x2="229.3" y2="85" stroke="#888" stroke-dasharray="5 4"/>
    <text x="180" y="96" fill="#555">radio</text>
    <use href="#p1" x="160" y="125"/>
    <use href="#p2" x="229.3" y="85"/>
    <text x="160" y="232" text-anchor="middle" fill="#222">1: centro. 2: un punto de la circunferencia.</text>
    <text x="160" y="248" text-anchor="middle" fill="#222">El radio se mide en el plano de la cámara.</text>
  </g>

  <!-- CIRCR -->
  <g transform="translate(320,0)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CIRCR</text>
    <circle cx="160" cy="125" r="80" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="160" y1="125" x2="240" y2="125" stroke="#888" stroke-dasharray="5 4"/>
    <text x="200" y="118" text-anchor="middle" fill="#555">radio</text>
    <use href="#p1" x="160" y="125"/>
    <text x="160" y="232" text-anchor="middle" fill="#222">1: centro. El radio se escribe en la barra de</text>
    <text x="160" y="248" text-anchor="middle" fill="#222">estado o se pasa como parámetro.</text>
  </g>

  <line x1="20" y1="268" x2="620" y2="268" stroke="#ddd"/>

  <!-- CIR3P -->
  <g transform="translate(0,275)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CIR3P</text>
    <circle cx="160" cy="125" r="80" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <polygon points="84.8,97.6 229.3,85 173.9,203.8" fill="none" stroke="#888" stroke-dasharray="5 4"/>
    <use href="#p1" x="84.8" y="97.6"/>
    <use href="#p2" x="229.3" y="85"/>
    <use href="#p3" x="173.9" y="203.8"/>
    <text x="160" y="232" text-anchor="middle" fill="#222">Pasa por los tres puntos proyectados</text>
    <text x="160" y="248" text-anchor="middle" fill="#222">en el plano de la cámara (en planta).</text>
  </g>

  <!-- CIR3D -->
  <g transform="translate(320,275)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CIR3D</text>
    <polygon points="30,190 210,215 295,95 115,70" fill="#f6f6f6" stroke="#aaa"/>
    <ellipse cx="165" cy="145" rx="85" ry="38" transform="rotate(-20 165 145)" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <polygon points="85.5,160.1 227.7,102 191.7,175.1" fill="none" stroke="#888" stroke-dasharray="5 4"/>
    <use href="#p1" x="85.5" y="160.1"/>
    <use href="#p2" x="227.7" y="102"/>
    <use href="#p3" x="191.7" y="175.1"/>
    <text x="160" y="232" text-anchor="middle" fill="#222">Pasa por los tres puntos, en el plano que</text>
    <text x="160" y="248" text-anchor="middle" fill="#222">forman, sea cual sea la orientación de la cámara.</text>
  </g>

  <rect x="20" y="558" width="600" height="26" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="571"/>
  <text x="56" y="576" fill="#222">Puntos digitalizados, en orden. El resultado es una línea cerrada.</text>
</svg>
