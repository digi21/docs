<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="p2"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text></g>
    <g id="p3"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text></g>
    <g id="p4"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">4</text></g>
    <pattern id="textura" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#dce8f5"/><path d="M 0 12 L 12 0" stroke="#b5cbe4" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>

  <!-- INS_FOTO -->
  <g transform="translate(0,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">INS_FOTO</text>
    <g transform="translate(140,100) rotate(-20)">
      <rect x="-64" y="-48" width="128" height="96" fill="url(#textura)" stroke="#1f5fa8" stroke-width="2"/>
      <text x="0" y="-26" text-anchor="middle" fill="#1f5fa8">imagen</text>
      <line x1="0" y1="0" x2="64" y2="0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
    </g>
    <use href="#p1" x="140" y="100"/>
    <use href="#p2" x="200.1" y="78.1"/>
    <text x="140" y="200" text-anchor="middle" fill="#222">1: centro. 2: mitad del lado derecho. La</text>
    <text x="140" y="215" text-anchor="middle" fill="#222">distancia 1-2 es medio ancho y 1-2 da el giro.</text>
    <text x="140" y="230" text-anchor="middle" fill="#222">Conserva la proporción de la imagen.</text>
  </g>

  <!-- INS_FOTO_2P_AA -->
  <g transform="translate(280,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">INS_FOTO_2P_AA</text>
    <g transform="translate(140,105) rotate(-20)">
      <rect x="-80" y="-40" width="160" height="80" fill="url(#textura)" stroke="#1f5fa8" stroke-width="2"/>
      <text x="0" y="-18" text-anchor="middle" fill="#1f5fa8">imagen</text>
    </g>
    <line x1="78.5" y1="169.9" x2="201.5" y2="40.1" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <use href="#p1" x="78.5" y="169.9"/>
    <use href="#p2" x="201.5" y="40.1"/>
    <text x="232" y="160" fill="#555">AA = 20</text>
    <text x="140" y="200" text-anchor="middle" fill="#222">1 y 2: esquinas opuestas. Los lados siguen</text>
    <text x="140" y="215" text-anchor="middle" fill="#222">el ángulo activo AA. La imagen se estira</text>
    <text x="140" y="230" text-anchor="middle" fill="#222">hasta llenar el rectángulo.</text>
  </g>

  <!-- INS_FOTO_3P -->
  <g transform="translate(560,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">INS_FOTO_3P</text>
    <g transform="translate(140,110) rotate(-20)">
      <rect x="-80" y="-45" width="160" height="90" fill="url(#textura)" stroke="#1f5fa8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#1f5fa8">imagen</text>
    </g>
    <use href="#p1" x="80.2" y="179.6"/>
    <use href="#p2" x="230.6" y="124.9"/>
    <use href="#p3" x="143.4" y="60.9"/>
    <text x="140" y="200" text-anchor="middle" fill="#222">1 y 2: esquinas de un lado; dan el giro.</text>
    <text x="140" y="215" text-anchor="middle" fill="#222">3: cualquier punto del lado opuesto. La</text>
    <text x="140" y="230" text-anchor="middle" fill="#222">imagen se estira hasta llenar el rectángulo.</text>
  </g>

  <line x1="20" y1="248" x2="820" y2="248" stroke="#ddd"/>

  <!-- PUNTO_2P -->
  <g transform="translate(0,258)">
    <text x="190" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">PUNTO_2P</text>
    <g transform="translate(60,170)" fill="none" stroke="#999" stroke-width="1.5">
      <path d="M 0 0 L 20 0 L 20 -8 L 30 0 L 20 8 L 20 0"/>
    </g>
    <text x="60" y="195" fill="#777">escala 1</text>
    <g transform="translate(160,150) rotate(-30)">
      <path d="M 0 0 L 100 0 L 100 -40 L 150 0 L 100 40 L 100 0" fill="none" stroke="#2e7d32" stroke-width="3"/>
      <line x1="0" y1="0" x2="150" y2="0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
    </g>
    <use href="#p1" x="160" y="150"/>
    <use href="#p2" x="290" y="75"/>
    <text x="190" y="222" text-anchor="middle" fill="#222">1: posición del punto. 2: la distancia 1-2 es la escala del símbolo y la</text>
    <text x="190" y="237" text-anchor="middle" fill="#222">dirección 1-2, su giro.</text>
  </g>

  <!-- COPIA_R -->
  <g transform="translate(400,258)">
    <text x="210" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">COPIA_R</text>
    <polygon points="50,170 90,170 90,145 70,130 50,145" fill="#eee" stroke="#999" stroke-width="2"/>
    <g transform="translate(250,140) rotate(-30)">
      <polygon points="0,0 40,0 40,-25 20,-40 0,-25" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2.5"/>
    </g>
    <line x1="50" y1="170" x2="250" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="250" y1="140" x2="345.3" y2="85" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <line x1="250" y1="140" x2="320" y2="140" stroke="#999" stroke-width="1"/>
    <path d="M 300 140 A 50 50 0 0 0 293.3 115" fill="none" stroke="#555"/>
    <text x="304" y="128" fill="#555">giro</text>
    <use href="#p1" x="90" y="158"/>
    <use href="#p2" x="50" y="170"/>
    <use href="#p3" x="250" y="140"/>
    <use href="#p4" x="345.3" y="85"/>
    <text x="210" y="222" text-anchor="middle" fill="#222">1: entidad. 2: punto base. 3: destino del punto base. 4: la copia gira el</text>
    <text x="210" y="237" text-anchor="middle" fill="#222">ángulo de la dirección 3-4. Con 4 al este de 3, la copia no gira.</text>
  </g>

  <rect x="20" y="508" width="800" height="44" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="38" y="530"/>
  <text x="52" y="534" fill="#222">Puntos digitalizados, en orden.</text>
  <rect x="260" y="522" width="30" height="16" fill="url(#textura)" stroke="#1f5fa8"/>
  <text x="298" y="534" fill="#222">Imagen insertada.</text>
  <polygon points="450,538 470,538 470,526 460,520 450,526" fill="#eee" stroke="#999" stroke-width="1.5"/>
  <text x="478" y="534" fill="#222">Original.</text>
  <polygon points="560,538 580,538 580,526 570,520 560,526" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="588" y="534" fill="#222">Copia.</text>
</svg>
