<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="840" height="600" fill="#ffffff"/>

  <!-- 2P -->
  <g transform="translate(0,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">2P</text>
    <polygon points="60,190 90,60 220,90 190,220" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="60" y1="190" x2="220" y2="90" stroke="#888" stroke-dasharray="5 4"/>
    <use href="#p1" x="60" y="190"/>
    <use href="#p2" x="220" y="90"/>
    <text x="140" y="252" text-anchor="middle" fill="#222">1 y 2: esquinas opuestas.</text>
    <text x="140" y="268" text-anchor="middle" fill="#222">Siempre es un cuadrado.</text>
  </g>

  <!-- 2P_AA -->
  <g transform="translate(280,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">2P_AA</text>
    <polygon points="50,200 227.6,135.4 200,60 22.4,124.6" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="50" y1="200" x2="200" y2="60" stroke="#888" stroke-dasharray="5 4"/>
    <line x1="50" y1="200" x2="150" y2="200" stroke="#e67e22" stroke-dasharray="4 3"/>
    <path d="M 110 200 A 60 60 0 0 0 106.4 179.5" fill="none" stroke="#e67e22" stroke-width="2"/>
    <text x="114" y="194" fill="#e67e22" font-weight="bold">AA</text>
    <use href="#p1" x="50" y="200"/>
    <use href="#p2" x="200" y="60"/>
    <text x="140" y="252" text-anchor="middle" fill="#222">1 y 2: esquinas opuestas.</text>
    <text x="140" y="268" text-anchor="middle" fill="#222">Los lados siguen el ángulo activo.</text>
  </g>

  <!-- RECTANGULO_2P_NORTE -->
  <g transform="translate(560,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RECTANGULO_2P_NORTE</text>
    <polygon points="50,200 230,200 230,80 50,80" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="50" y1="200" x2="230" y2="80" stroke="#888" stroke-dasharray="5 4"/>
    <line x1="255" y1="120" x2="255" y2="60" stroke="#555" stroke-width="1.5" marker-end="url(#flecha)"/>
    <text x="255" y="52" text-anchor="middle" fill="#555" font-weight="bold">N</text>
    <use href="#p1" x="50" y="200"/>
    <use href="#p2" x="230" y="80"/>
    <text x="140" y="252" text-anchor="middle" fill="#222">1 y 2: esquinas opuestas.</text>
    <text x="140" y="268" text-anchor="middle" fill="#222">Lados paralelos a los ejes X e Y.</text>
  </g>

  <line x1="20" y1="290" x2="820" y2="290" stroke="#ddd"/>

  <!-- 3P -->
  <g transform="translate(140,300)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">3P</text>
    <polygon points="80,205 230,135 186.8,42.5 36.8,112.5" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="230" y1="135" x2="80" y2="205" stroke="#1f5fa8" stroke-width="4"/>
    <use href="#p1" x="80" y="205"/>
    <use href="#p2" x="230" y="135"/>
    <use href="#p3" x="104" y="81"/>
    <text x="140" y="245" text-anchor="middle" fill="#222">1 y 2: un lado. 3: cualquier punto</text>
    <text x="140" y="261" text-anchor="middle" fill="#222">del lado opuesto (fija el otro lado).</text>
  </g>

  <!-- RECTANGULO_DR -->
  <g transform="translate(420,300)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RECTANGULO_DR=ancho alto</text>
    <polygon points="231.3,138.2 194.3,56.2 48.7,121.8 85.7,203.8" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="140" y1="130" x2="250" y2="80" stroke="#888" stroke-dasharray="5 4"/>
    <text x="128" y="210" fill="#222" transform="rotate(-24.4 128 210)">ancho</text>
    <text x="226" y="86" fill="#222" transform="rotate(65.6 226 86)">alto</text>
    <use href="#p1" x="140" y="130"/>
    <use href="#p2" x="250" y="80"/>
    <text x="140" y="245" text-anchor="middle" fill="#222">1: centro. 2: dirección del lado ancho.</text>
    <text x="140" y="261" text-anchor="middle" fill="#222">Las medidas son los parámetros.</text>
  </g>

  <!-- Leyenda -->
  <rect x="20" y="568" width="800" height="26" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="581"/>
  <text x="56" y="586" fill="#222">Puntos digitalizados, en orden. La línea discontinua une los dos puntos; el resultado es una línea cerrada de 5 vértices.</text>
</svg>
