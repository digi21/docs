<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="viejo"><circle r="5" fill="#fff" stroke="#999" stroke-width="1.5"/></g>
    <g id="cruz" stroke="#c0392b" stroke-width="2.5"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="0" y1="-10" x2="0" y2="10"/></g>
  </defs>
  <rect width="480" height="470" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">JUNTAR</text>

  <circle cx="240" cy="170" r="48" fill="none" stroke="#999" stroke-dasharray="4 4"/>
  <text x="292" y="116" fill="#777">cursor</text>

  <!-- geometría antes -->
  <polyline points="60,80 216,152" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="420,130 268,160" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="160,320 232,214" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- geometría después -->
  <polyline points="60,80 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="420,130 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="160,320 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>

  <use href="#viejo" x="216" y="152"/><use href="#viejo" x="268" y="160"/><use href="#viejo" x="232" y="214"/>
  <use href="#cruz" x="240" y="170"/>

  <text x="240" y="358" text-anchor="middle" fill="#222">Los vértices de línea que quedan dentro del cursor</text>
  <text x="240" y="376" text-anchor="middle" fill="#222">se mueven a la X e Y del punto digitalizado.</text>
  <text x="240" y="394" text-anchor="middle" fill="#222">La Z de cada vértice no cambia.</text>

  <rect x="16" y="412" width="448" height="48" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#viejo" x="34" y="428"/>
  <text x="46" y="432" fill="#222">Posición original del vértice.</text>
  <use href="#cruz" x="276" y="428"/>
  <text x="292" y="432" fill="#222">Punto digitalizado.</text>
  <line x1="24" y1="448" x2="50" y2="448" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="58" y="452" fill="#222">Geometría antes de la orden.</text>
</svg>
