<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
    <g id="p4"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4</text></g>
  </defs>
  <rect width="840" height="640" fill="#ffffff"/>

  <!-- CEBRA -->
  <g transform="translate(0,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CEBRA (N = 3)</text>
    <rect x="40" y="90" width="200" height="110" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
    <g fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2">
      <rect x="40" y="90" width="40" height="110"/>
      <rect x="120" y="90" width="40" height="110"/>
      <rect x="200" y="90" width="40" height="110"/>
    </g>
    <use href="#p1" x="40" y="200"/>
    <use href="#p2" x="240" y="200"/>
    <use href="#p3" x="150" y="90"/>
    <text x="140" y="238" text-anchor="middle" fill="#222">1-2: un lado; 3: un punto del lado opuesto.</text>
    <text x="140" y="254" text-anchor="middle" fill="#222">1→2 se divide en 2N−1 partes iguales:</text>
    <text x="140" y="270" text-anchor="middle" fill="#222">N franjas blancas alternas.</text>
  </g>

  <!-- CEBRA_4P -->
  <g transform="translate(280,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CEBRA_4P (N = 3)</text>
    <polygon points="40,210 240,190 220,80 60,100" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
    <g fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2">
      <polygon points="40,210 80,206 92,96 60,100"/>
      <polygon points="120,202 160,198 156,88 124,92"/>
      <polygon points="200,194 240,190 220,80 188,84"/>
    </g>
    <use href="#p1" x="40" y="210"/>
    <use href="#p2" x="240" y="190"/>
    <use href="#p3" x="220" y="80"/>
    <use href="#p4" x="60" y="100"/>
    <text x="140" y="238" text-anchor="middle" fill="#222">Cuadrilátero 1-2-3-4. Los lados 1→2 y 4→3</text>
    <text x="140" y="254" text-anchor="middle" fill="#222">se dividen en 2N−1 partes iguales.</text>
  </g>

  <!-- ESCALERA -->
  <g transform="translate(560,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ESCALERA (N = 4)</text>
    <g stroke="#1f5fa8" stroke-width="2">
      <line x1="40" y1="200" x2="240" y2="200"/><line x1="40" y1="170" x2="240" y2="170"/>
      <line x1="40" y1="140" x2="240" y2="140"/><line x1="40" y1="110" x2="240" y2="110"/>
      <line x1="40" y1="80" x2="240" y2="80"/>
      <line x1="40" y1="80" x2="40" y2="200"/><line x1="240" y1="80" x2="240" y2="200"/>
    </g>
    <use href="#p1" x="40" y="200"/>
    <use href="#p2" x="240" y="200"/>
    <use href="#p3" x="120" y="80"/>
    <text x="140" y="238" text-anchor="middle" fill="#222">1-2: el primer peldaño; 3: un punto del</text>
    <text x="140" y="254" text-anchor="middle" fill="#222">último. N peldaños iguales, paralelos a 1-2.</text>
  </g>

  <line x1="20" y1="290" x2="820" y2="290" stroke="#ddd"/>

  <!-- ESCALERA_DA -->
  <g transform="translate(0,300)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ESCALERA_DA</text>
    <g stroke="#1f5fa8" stroke-width="2">
      <line x1="60" y1="210" x2="100" y2="70"/><line x1="200" y1="210" x2="240" y2="70"/>
      <line x1="60" y1="210" x2="200" y2="210"/><line x1="69.1" y1="178.3" x2="209.1" y2="178.3"/>
      <line x1="78.2" y1="146.6" x2="218.2" y2="146.6"/><line x1="87.3" y1="114.9" x2="227.3" y2="114.9"/>
      <line x1="96.4" y1="83.2" x2="236.4" y2="83.2"/>
    </g>
    <line x1="48" y1="210" x2="57" y2="178.3" stroke="#e67e22" stroke-width="2"/>
    <text x="34" y="200" fill="#e67e22" font-weight="bold">DA</text>
    <use href="#p1" x="60" y="210"/>
    <use href="#p2" x="100" y="70"/>
    <use href="#p3" x="240" y="70"/>
    <use href="#p4" x="200" y="210"/>
    <text x="140" y="238" text-anchor="middle" fill="#222">1→2 y 4→3: los dos laterales. Un peldaño</text>
    <text x="140" y="254" text-anchor="middle" fill="#222">cada DA desde la línea 1-4, mientras quepa</text>
    <text x="140" y="270" text-anchor="middle" fill="#222">en el lateral más corto.</text>
  </g>

  <!-- CUADROS -->
  <g transform="translate(280,300)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CUADROS (3 × 4)</text>
    <g stroke="#1f5fa8" stroke-width="2">
      <line x1="40" y1="200" x2="240" y2="200"/><line x1="40" y1="160" x2="240" y2="160"/>
      <line x1="40" y1="120" x2="240" y2="120"/><line x1="40" y1="80" x2="240" y2="80"/>
      <line x1="40" y1="80" x2="40" y2="200"/><line x1="90" y1="80" x2="90" y2="200"/>
      <line x1="140" y1="80" x2="140" y2="200"/><line x1="190" y1="80" x2="190" y2="200"/>
      <line x1="240" y1="80" x2="240" y2="200"/>
    </g>
    <use href="#p1" x="40" y="200"/>
    <use href="#p2" x="240" y="200"/>
    <use href="#p3" x="150" y="80"/>
    <text x="140" y="238" text-anchor="middle" fill="#222">Rectángulo de 3P dividido en celdas: pide</text>
    <text x="140" y="254" text-anchor="middle" fill="#222">cuántas divisiones paralelas a la base (3) y</text>
    <text x="140" y="270" text-anchor="middle" fill="#222">cuántas perpendiculares (4).</text>
  </g>

  <!-- CUADROS_4P -->
  <g transform="translate(560,300)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CUADROS_4P (3 × 4)</text>
    <g stroke="#1f5fa8" stroke-width="2">
      <line x1="40" y1="210" x2="240" y2="195"/><line x1="45" y1="171.7" x2="235" y2="156.7"/>
      <line x1="50" y1="133.3" x2="230" y2="118.3"/><line x1="55" y1="95" x2="225" y2="80"/>
      <line x1="40" y1="210" x2="55" y2="95"/><line x1="90" y1="206.25" x2="97.5" y2="91.25"/>
      <line x1="140" y1="202.5" x2="140" y2="87.5"/><line x1="190" y1="198.75" x2="182.5" y2="83.75"/>
      <line x1="240" y1="195" x2="225" y2="80"/>
    </g>
    <use href="#p1" x="40" y="210"/>
    <use href="#p2" x="240" y="195"/>
    <use href="#p3" x="225" y="80"/>
    <use href="#p4" x="55" y="95"/>
    <text x="140" y="238" text-anchor="middle" fill="#222">Igual que CUADROS sobre el cuadrilátero</text>
    <text x="140" y="254" text-anchor="middle" fill="#222">1-2-3-4 (1-2 es la base). Con 1 división</text>
    <text x="140" y="270" text-anchor="middle" fill="#222">en un sentido, salen escalones.</text>
  </g>

  <rect x="20" y="598" width="800" height="36" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="616"/>
  <text x="56" y="621" fill="#222">Puntos digitalizados, en orden. N y las divisiones se escriben en la barra de estado mientras se digitalizan los puntos.</text>
</svg>
