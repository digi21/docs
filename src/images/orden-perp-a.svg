<svg xmlns="http://www.w3.org/2000/svg" width="480" height="642" viewBox="0 0 480 642" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="eje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="tramo">
      <line x1="30" y1="190" x2="170" y2="190" stroke="#1f5fa8" stroke-width="4"/>
      <line x1="170" y1="190" x2="265" y2="190" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="30" cy="190" r="4" fill="#1f5fa8"/><circle cx="170" cy="190" r="4" fill="#1f5fa8"/>
      <text x="100" y="210" text-anchor="middle" fill="#1f5fa8">tramo seleccionado</text>
      <text x="218" y="210" text-anchor="middle" fill="#1f5fa8" font-size="12">prolongación</text>
    </g>
  </defs>  <rect width="480" height="642" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">PERP_A</text>

  <text x="20" y="56" font-weight="bold" fill="#555">Planta</text>
  <g transform="translate(90,20)">
    <use href="#tramo"/>
    <line x1="70" y1="90" x2="70" y2="190" stroke="#e67e22" stroke-width="3"/>
    <line x1="230" y1="110" x2="230" y2="190" stroke="#e67e22" stroke-width="3"/>
    <polyline points="70,178 82,178 82,190" fill="none" stroke="#555"/>
    <polyline points="230,178 242,178 242,190" fill="none" stroke="#555"/>
    <circle cx="70" cy="190" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <circle cx="230" cy="190" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <use href="#p1" x="70" y="90"/>
    <use href="#p2" x="230" y="110"/>
  </g>
  <text x="240" y="262" text-anchor="middle" fill="#222">Selecciona el tramo. Cada punto digitalizado genera un segmento</text>
  <text x="240" y="278" text-anchor="middle" fill="#222">desde el punto hasta el pie de la perpendicular. El pie puede</text>
  <text x="240" y="294" text-anchor="middle" fill="#222">caer en la prolongación del tramo (punto 2).</text>
  <line x1="16" y1="316" x2="464" y2="316" stroke="#ddd"/>
  <text x="20" y="340" font-weight="bold" fill="#555">Alzado de un segmento</text>
  <line x1="22" y1="462" x2="22" y2="352" stroke="#777" stroke-width="1.2" marker-end="url(#eje)"/>
  <text x="28" y="362" fill="#777">Z</text>
  <text x="130" y="364" text-anchor="middle" fill="#222" font-weight="bold">PERP_A</text>
  <line x1="60" y1="440" x2="60" y2="385" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="60" cy="440" r="5" fill="#1f5fa8"/>
  <text x="70" y="456" fill="#1f5fa8">tramo</text>
  <line x1="60" y1="385" x2="200" y2="385" stroke="#e67e22" stroke-width="3"/>
  <circle cx="60" cy="385" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="50" y="382" fill="#555" text-anchor="end">pie</text>
  <use href="#p1" x="200" y="385"/>
  <text x="130" y="484" text-anchor="middle" fill="#222">El pie toma la Z del punto.</text>

  <line x1="240" y1="352" x2="240" y2="470" stroke="#ddd"/>
  <line x1="252" y1="462" x2="252" y2="352" stroke="#777" stroke-width="1.2" marker-end="url(#eje)"/>
  <text x="258" y="362" fill="#777">Z</text>
  <text x="360" y="364" text-anchor="middle" fill="#222" font-weight="bold">PERP_A=1</text>
  <circle cx="290" cy="440" r="5" fill="#1f5fa8"/>
  <text x="300" y="456" fill="#1f5fa8">tramo</text>
  <line x1="290" y1="440" x2="430" y2="385" stroke="#e67e22" stroke-width="3"/>
  <circle cx="290" cy="440" r="8" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="278" y="430" fill="#555" text-anchor="end">pie</text>
  <use href="#p1" x="430" y="385"/>
  <text x="360" y="484" text-anchor="middle" fill="#222">El pie toma la Z del tramo.</text>

  <rect x="16" y="506" width="448" height="122" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="32" y1="523" x2="72" y2="523" stroke="#1f5fa8" stroke-width="4"/>
  <text x="86" y="527.5" fill="#222">Tramo seleccionado (discontinuo: su prolongación).</text>
  <use href="#p1" x="52" y="545"/>
  <text x="86" y="549.5" fill="#222">Puntos digitalizados.</text>
  <line x1="32" y1="567" x2="72" y2="567" stroke="#e67e22" stroke-width="3"/>
  <text x="86" y="571.5" fill="#222">Segmento que se crea por cada punto.</text>
  <circle cx="52" cy="589" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="86" y="593.5" fill="#222">Pie de la perpendicular.</text>
  <circle cx="52" cy="611" r="5" fill="#1f5fa8"/>
  <text x="86" y="615.5" fill="#222">Tramo en el alzado (se ve como un punto).</text>
</svg>
