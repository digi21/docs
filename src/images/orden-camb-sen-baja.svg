<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="440" height="430" fill="#ffffff"/>

  <text x="220" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">CAMB_SEN_BAJA</text>

  <text x="30" y="58" fill="#222" font-weight="bold">Z del primer vértice &lt; Z del último</text>
  <text x="30" y="82" fill="#777">antes</text>
  <line x1="55" y1="100" x2="385" y2="100" stroke="#999" stroke-width="2.5" marker-end="url(#flechaGris)"/>
  <text x="55" y="120" fill="#777">1: z 100</text><text x="385" y="120" text-anchor="end" fill="#777">n: z 120</text>
  <text x="30" y="150" fill="#1f5fa8">después</text>
  <line x1="385" y1="168" x2="55" y2="168" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="385" y="188" text-anchor="end" fill="#1f5fa8">1: z 120</text><text x="55" y="188" fill="#1f5fa8">n: z 100</text>

  <line x1="20" y1="206" x2="420" y2="206" stroke="#ddd"/>

  <text x="30" y="230" fill="#222" font-weight="bold">Z del primer vértice ≥ Z del último</text>
  <text x="30" y="254" fill="#777">antes y después</text>
  <line x1="55" y1="272" x2="385" y2="272" stroke="#999" stroke-width="2.5" marker-end="url(#flechaGris)"/>
  <text x="55" y="292" fill="#777">1: z 120</text><text x="385" y="292" text-anchor="end" fill="#777">n: z 100</text>

  <text x="220" y="322" text-anchor="middle" fill="#222">La orden compara la Z del primer y del último vértice. Si la</text>
  <text x="220" y="339" text-anchor="middle" fill="#222">del primero es menor, invierte el orden de los vértices y la</text>
  <text x="220" y="356" text-anchor="middle" fill="#222">línea baja del extremo más alto al más bajo. Si no, no cambia.</text>

  <rect x="15" y="374" width="410" height="44" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="30" y1="388" x2="60" y2="388" stroke="#999" stroke-width="2.5"/>
  <text x="68" y="392" fill="#222">Línea antes de la orden. La flecha marca el sentido.</text>
  <line x1="30" y1="406" x2="60" y2="406" stroke="#1f5fa8" stroke-width="2.5"/>
  <text x="68" y="410" fill="#222">Línea después de la orden.</text>
</svg>
