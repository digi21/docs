<svg xmlns="http://www.w3.org/2000/svg" width="480" height="438" viewBox="0 0 480 438" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="480" height="438" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">TRIM_M</text>

  <line x1="230" y1="55" x2="230" y2="235" stroke="#444" stroke-width="3"/>
  <g stroke="#1f5fa8" stroke-width="3">
    <line x1="70" y1="95" x2="230" y2="95"/>
    <line x1="70" y1="145" x2="230" y2="145"/>
    <line x1="70" y1="195" x2="230" y2="195"/>
  </g>
  <g stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4">
    <line x1="230" y1="95" x2="390" y2="95"/>
    <line x1="230" y1="145" x2="380" y2="145"/>
    <line x1="230" y1="195" x2="400" y2="195"/>
  </g>
  <line x1="320" y1="70" x2="320" y2="222" stroke="#555" stroke-width="1.5" stroke-dasharray="6 3"/>
  <use href="#p1" x="230" y="70"/>
  <use href="#p2" x="320" y="66"/>
  <use href="#p3" x="320" y="224"/>

  <text x="240" y="270" text-anchor="middle" fill="#222">1: límite. 2, 3…: vértices de un límite virtual,</text>
  <text x="240" y="288" text-anchor="middle" fill="#222">que se termina con el botón de RESET.</text>
  <text x="240" y="306" text-anchor="middle" fill="#222">Cada línea que cruza el límite virtual se parte en los</text>
  <text x="240" y="324" text-anchor="middle" fill="#222">cruces con el límite, y se elimina el trozo por el que</text>
  <text x="240" y="342" text-anchor="middle" fill="#222">pasa el límite virtual.</text>

  <rect x="16" y="364" width="448" height="62" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="382"/>
  <text x="60" y="386" fill="#222">Selección o punto, en orden.</text>
  <line x1="250" y1="382" x2="286" y2="382" stroke="#444" stroke-width="3"/>
  <text x="294" y="386" fill="#222">Límite.</text>
  <line x1="26" y1="406" x2="62" y2="406" stroke="#555" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="70" y="410" fill="#222">Límite virtual.</text>
  <line x1="250" y1="406" x2="286" y2="406" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="294" y="410" fill="#222">Trozos que se eliminan.</text>
</svg>
