  <text x="230" y="214" text-anchor="middle" fill="#222">La línea seleccionada se sustituye por la spline cúbica</text>
  <text x="230" y="230" text-anchor="middle" fill="#222">que pasa por sus vértices: 10 vértices por tramo, y el</text>
