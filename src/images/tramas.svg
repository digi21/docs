<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <clipPath id="contorno"><polygon points="20,70 150,50 195,140 125,205 35,185"/></clipPath>
    <g id="familiaAA" stroke="#1f5fa8" stroke-width="1.6">
      <line x1="-200" y1="-160" x2="400" y2="-160"/><line x1="-200" y1="-144" x2="400" y2="-144"/>
      <line x1="-200" y1="-128" x2="400" y2="-128"/><line x1="-200" y1="-112" x2="400" y2="-112"/>
      <line x1="-200" y1="-96" x2="400" y2="-96"/><line x1="-200" y1="-80" x2="400" y2="-80"/>
      <line x1="-200" y1="-64" x2="400" y2="-64"/><line x1="-200" y1="-48" x2="400" y2="-48"/>
      <line x1="-200" y1="-32" x2="400" y2="-32"/><line x1="-200" y1="-16" x2="400" y2="-16"/>
      <line x1="-200" y1="0" x2="400" y2="0"/><line x1="-200" y1="16" x2="400" y2="16"/>
      <line x1="-200" y1="32" x2="400" y2="32"/><line x1="-200" y1="48" x2="400" y2="48"/>
      <line x1="-200" y1="64" x2="400" y2="64"/><line x1="-200" y1="80" x2="400" y2="80"/>
      <line x1="-200" y1="96" x2="400" y2="96"/><line x1="-200" y1="112" x2="400" y2="112"/>
      <line x1="-200" y1="128" x2="400" y2="128"/><line x1="-200" y1="144" x2="400" y2="144"/>
      <line x1="-200" y1="160" x2="400" y2="160"/>
    </g>
    <g id="familiaPerp" stroke="#1f5fa8" stroke-width="1.6">
      <line x1="-168" y1="-200" x2="-168" y2="300"/><line x1="-144" y1="-200" x2="-144" y2="300"/>
      <line x1="-120" y1="-200" x2="-120" y2="300"/><line x1="-96" y1="-200" x2="-96" y2="300"/>
      <line x1="-72" y1="-200" x2="-72" y2="300"/><line x1="-48" y1="-200" x2="-48" y2="300"/>
      <line x1="-24" y1="-200" x2="-24" y2="300"/><line x1="0" y1="-200" x2="0" y2="300"/>
      <line x1="24" y1="-200" x2="24" y2="300"/><line x1="48" y1="-200" x2="48" y2="300"/>
      <line x1="72" y1="-200" x2="72" y2="300"/><line x1="96" y1="-200" x2="96" y2="300"/>
      <line x1="120" y1="-200" x2="120" y2="300"/><line x1="144" y1="-200" x2="144" y2="300"/>
      <line x1="168" y1="-200" x2="168" y2="300"/>
    </g>
  </defs>
  <rect width="840" height="330" fill="#ffffff"/>

  <!-- RAYAR -->
  <g transform="translate(0,0)">
    <text x="105" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RAYAR</text>
    <g clip-path="url(#contorno)"><use href="#familiaAA" transform="translate(105,128) rotate(-30)"/></g>
    <polygon points="20,70 150,50 195,140 125,205 35,185" fill="none" stroke="#222" stroke-width="2.5"/>
    <text x="105" y="235" text-anchor="middle" fill="#222">Rayas en la dirección de AA,</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">separadas por la distancia activa</text>
    <text x="105" y="265" text-anchor="middle" fill="#222">secundaria.</text>
  </g>

  <!-- TRAMAR -->
  <g transform="translate(210,0)">
    <text x="105" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">TRAMAR</text>
    <g clip-path="url(#contorno)">
      <use href="#familiaAA" transform="translate(105,128) rotate(-30)"/>
      <use href="#familiaPerp" transform="translate(105,128) rotate(-30)"/>
    </g>
    <polygon points="20,70 150,50 195,140 125,205 35,185" fill="none" stroke="#222" stroke-width="2.5"/>
    <text x="105" y="235" text-anchor="middle" fill="#222">Las rayas de RAYAR y otra familia</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">perpendicular a AA, separada por la</text>
    <text x="105" y="265" text-anchor="middle" fill="#222">distancia activa principal.</text>
  </g>

  <!-- PUNTEAR -->
  <g transform="translate(420,0)">
    <text x="105" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">PUNTEAR</text>
    <g clip-path="url(#contorno)">
      <g transform="translate(105,128) rotate(-30)" fill="#1f5fa8">
        <g id="filaPuntos">
          <circle cx="-168" cy="0" r="2.6"/><circle cx="-144" cy="0" r="2.6"/><circle cx="-120" cy="0" r="2.6"/>
          <circle cx="-96" cy="0" r="2.6"/><circle cx="-72" cy="0" r="2.6"/><circle cx="-48" cy="0" r="2.6"/>
          <circle cx="-24" cy="0" r="2.6"/><circle cx="0" cy="0" r="2.6"/><circle cx="24" cy="0" r="2.6"/>
          <circle cx="48" cy="0" r="2.6"/><circle cx="72" cy="0" r="2.6"/><circle cx="96" cy="0" r="2.6"/>
          <circle cx="120" cy="0" r="2.6"/><circle cx="144" cy="0" r="2.6"/><circle cx="168" cy="0" r="2.6"/>
        </g>
        <use href="#filaPuntos" y="-160"/><use href="#filaPuntos" y="-144"/><use href="#filaPuntos" y="-128"/>
        <use href="#filaPuntos" y="-112"/><use href="#filaPuntos" y="-96"/><use href="#filaPuntos" y="-80"/>
        <use href="#filaPuntos" y="-64"/><use href="#filaPuntos" y="-48"/><use href="#filaPuntos" y="-32"/>
        <use href="#filaPuntos" y="-16"/><use href="#filaPuntos" y="16"/><use href="#filaPuntos" y="32"/>
        <use href="#filaPuntos" y="48"/><use href="#filaPuntos" y="64"/><use href="#filaPuntos" y="80"/>
        <use href="#filaPuntos" y="96"/><use href="#filaPuntos" y="112"/><use href="#filaPuntos" y="128"/>
        <use href="#filaPuntos" y="144"/><use href="#filaPuntos" y="160"/>
      </g>
    </g>
    <polygon points="20,70 150,50 195,140 125,205 35,185" fill="none" stroke="#222" stroke-width="2.5"/>
    <text x="105" y="235" text-anchor="middle" fill="#222">Un punto, con el código activo, en</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">cada cruce de la trama de TRAMAR.</text>
    <text x="105" y="265" text-anchor="middle" fill="#222">Solo los que quedan dentro.</text>
  </g>

  <!-- SIMB -->
  <g transform="translate(630,0)">
    <text x="105" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SIMB</text>
    <g clip-path="url(#contorno)">
      <g transform="translate(105,128) rotate(-30)" fill="none" stroke="#2e7d32" stroke-width="1.5">
        <g id="filaSimbolos"><path d="M -168 -3 l 3.5 6 h -7 z"/><path d="M -144 -3 l 3.5 6 h -7 z"/><path d="M -120 -3 l 3.5 6 h -7 z"/><path d="M -96 -3 l 3.5 6 h -7 z"/><path d="M -72 -3 l 3.5 6 h -7 z"/><path d="M -48 -3 l 3.5 6 h -7 z"/><path d="M -24 -3 l 3.5 6 h -7 z"/><path d="M 0 -3 l 3.5 6 h -7 z"/><path d="M 24 -3 l 3.5 6 h -7 z"/><path d="M 48 -3 l 3.5 6 h -7 z"/><path d="M 72 -3 l 3.5 6 h -7 z"/><path d="M 96 -3 l 3.5 6 h -7 z"/><path d="M 120 -3 l 3.5 6 h -7 z"/><path d="M 144 -3 l 3.5 6 h -7 z"/><path d="M 168 -3 l 3.5 6 h -7 z"/></g><use href="#filaSimbolos" y="-160"/><use href="#filaSimbolos" y="-144"/><use href="#filaSimbolos" y="-128"/><use href="#filaSimbolos" y="-112"/><use href="#filaSimbolos" y="-96"/><use href="#filaSimbolos" y="-80"/><use href="#filaSimbolos" y="-64"/><use href="#filaSimbolos" y="-48"/><use href="#filaSimbolos" y="-32"/><use href="#filaSimbolos" y="-16"/><use href="#filaSimbolos" y="16"/><use href="#filaSimbolos" y="32"/><use href="#filaSimbolos" y="48"/><use href="#filaSimbolos" y="64"/><use href="#filaSimbolos" y="80"/><use href="#filaSimbolos" y="96"/><use href="#filaSimbolos" y="112"/><use href="#filaSimbolos" y="128"/><use href="#filaSimbolos" y="144"/><use href="#filaSimbolos" y="160"/></g>
    </g>
    <polygon points="20,70 150,50 195,140 125,205 35,185" fill="none" stroke="#222" stroke-width="2.5"/>
    <text x="105" y="235" text-anchor="middle" fill="#222">Igual que PUNTEAR, pero con el</text>
    <text x="105" y="250" text-anchor="middle" fill="#222">símbolo elegido en el cuadro de</text>
    <text x="105" y="265" text-anchor="middle" fill="#222">diálogo, girado según AA.</text>
  </g>

  <rect x="20" y="282" width="800" height="40" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <text x="36" y="298" fill="#222">Ejemplo con AA = 30. Contorno negro: la línea cerrada seleccionada o, con parámetros, cada línea cerrada de esos códigos.</text>
  <text x="36" y="314" fill="#222">La distancia activa principal y la secundaria se asignan con DA (DA=principal secundaria). Aquí la secundaria es menor que la principal.</text>
</svg>
