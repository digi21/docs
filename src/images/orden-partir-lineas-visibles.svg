<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="nodo"><circle r="6.5" fill="#fff" stroke="#222" stroke-width="2"/></g>
  </defs>
  <rect width="480" height="440" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">PARTIR_LINEAS_VISIBLES</text>

  <line x1="50" y1="300" x2="240" y2="180" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="240" y1="180" x2="430" y2="60" stroke="#2e7d32" stroke-width="3"/>
  <line x1="80" y1="60" x2="240" y2="180" stroke="#8e44ad" stroke-width="3"/>
  <line x1="240" y1="180" x2="400" y2="300" stroke="#e67e22" stroke-width="3"/>
  <use href="#nodo" x="240" y="180"/>

  <text x="240" y="340" text-anchor="middle" fill="#222">Parte todas las líneas visibles por los puntos</text>
  <text x="240" y="358" text-anchor="middle" fill="#222">en que se cruzan.</text>
  <text x="240" y="376" text-anchor="middle" fill="#222">Dos líneas que se cruzan dan cuatro (un color por línea).</text>

  <rect x="16" y="394" width="448" height="38" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#nodo" x="36" y="413"/>
  <text x="50" y="417" fill="#222">Punto de cruce: extremo común de las líneas nuevas.</text>
</svg>