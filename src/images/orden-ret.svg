<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="cruz" stroke="#c0392b" stroke-width="2.5"><line x1="-10" y1="0" x2="10" y2="0"/><line x1="0" y1="-10" x2="0" y2="10"/></g>
  </defs>
  <rect width="480" height="500" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">RET</text>

  <polygon points="110,120 370,120 370,290 110,290" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="110,120 110,70 370,70 370,120" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 4"/>

  <line x1="400" y1="70" x2="400" y2="120" stroke="#555" stroke-width="1.2"/>
  <line x1="394" y1="70" x2="406" y2="70" stroke="#555" stroke-width="1.2"/>
  <line x1="394" y1="120" x2="406" y2="120" stroke="#555" stroke-width="1.2"/>
  <text x="412" y="100" fill="#555">d</text>

  <use href="#p1" x="240" y="70"/>
  <use href="#cruz" x="240" y="210"/>
  <text x="254" y="232" fill="#c0392b">lado</text>

  <text x="240" y="334" text-anchor="middle" fill="#222">Escribe la distancia d, selecciona el tramo (1) y digitaliza</text>
  <text x="240" y="352" text-anchor="middle" fill="#222">un punto a un lado del tramo. Si el punto queda dentro</text>
  <text x="240" y="370" text-anchor="middle" fill="#222">de la entidad, el tramo se desplaza d y se añade el alero</text>
  <text x="240" y="388" text-anchor="middle" fill="#222">(verde): una línea de 4 vértices con el código activo.</text>
  <text x="240" y="406" text-anchor="middle" fill="#222">Si queda fuera, la entidad no cambia y solo se añade el alero.</text>

  <rect x="16" y="424" width="448" height="64" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="34" y="444"/>
  <text x="48" y="448" fill="#222">Punto de selección del tramo.</text>
  <use href="#cruz" x="276" y="444"/>
  <text x="292" y="448" fill="#222">Punto digitalizado.</text>
  <line x1="24" y1="470" x2="50" y2="470" stroke="#2e7d32" stroke-width="3" stroke-dasharray="10 4"/>
  <text x="58" y="474" fill="#222">Alero: une el tramo original con el desplazado.</text>
</svg>
