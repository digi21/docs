  <rect width="440" height="312" fill="#ffffff"/>

  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">TRAMAR</text>

  <g transform="translate(10,10)">
    <g clip-path="url(#contorno)"><use href="#familiaAA" transform="translate(105,128) rotate(-30)"/><use href="#familiaPerp" transform="translate(105,128) rotate(-30)"/></g>
    <polygon points="20,70 150,50 195,140 125,205 35,185" fill="none" stroke="#222" stroke-width="2.5"/>
  </g>

  <line x1="250" y1="100" x2="330" y2="100" stroke="#999" stroke-width="1"/>
  <text x="336" y="104" fill="#888">este</text>
  <line x1="250" y1="100" x2="319.3" y2="60" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M 295 100 A 45 45 0 0 0 289 77.5" fill="none" stroke="#555"/>
  <text x="300" y="88" fill="#555">AA = 30</text>

  <rect x="236" y="124" width="190" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <polygon points="248,152 262,136 278,140 274,152" fill="none" stroke="#222" stroke-width="2"/>
  <text x="286" y="148" fill="#222">Contorno seleccionado.</text>
  <line x1="248" y1="166" x2="278" y2="166" stroke="#1f5fa8" stroke-width="1.6"/><text x="286" y="170" fill="#222">Rayas generadas.</text>

  <text x="220" y="246" text-anchor="middle" fill="#222">Dos familias de rayas: en la dirección de AA, separadas por la</text>
  <text x="220" y="261" text-anchor="middle" fill="#222">distancia activa secundaria, y perpendiculares a AA, separadas por la</text>
  <text x="220" y="276" text-anchor="middle" fill="#222">principal (DA=principal secundaria). Solo se añaden los tramos que</text>
  <text x="220" y="291" text-anchor="middle" fill="#222">quedan dentro del contorno, con el código activo y Z = 0.</text>
</svg>