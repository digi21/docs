<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="p2"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text></g>
    <g id="p3"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text></g>
    <pattern id="textura" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#dce8f5"/><path d="M 0 12 L 12 0" stroke="#b5cbe4" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="440" height="320" fill="#ffffff"/>

  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">INS_FOTO_3P</text>

  <g transform="translate(80,20)">
    <g transform="translate(140,110) rotate(-20)">
      <rect x="-80" y="-45" width="160" height="90" fill="url(#textura)" stroke="#1f5fa8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#1f5fa8">imagen</text>
    </g>
    <use href="#p1" x="80.2" y="179.6"/>
    <use href="#p2" x="230.6" y="124.9"/>
    <use href="#p3" x="143.4" y="60.9"/>
  </g>

  <text x="220" y="221" text-anchor="middle" fill="#222">1 y 2: esquinas de un lado; la dirección 1-2 es el giro.</text>
  <text x="220" y="236" text-anchor="middle" fill="#222">3: cualquier punto del lado opuesto. La imagen se estira</text>
  <text x="220" y="251" text-anchor="middle" fill="#222">hasta llenar el rectángulo: no conserva su relación de aspecto.</text>

  <rect x="20" y="266" width="400" height="44" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="38" y="288"/>
  <text x="52" y="292" fill="#222">Puntos digitalizados, en orden.</text>
  <rect x="236" y="280" width="30" height="16" fill="url(#textura)" stroke="#1f5fa8"/>
  <text x="274" y="292" fill="#222">Imagen insertada.</text>
</svg>
