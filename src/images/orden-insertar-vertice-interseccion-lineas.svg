<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="vert"><rect x="-5" y="-5" width="10" height="10" fill="#e67e22"/></g>
  </defs>
  <rect width="480" height="440" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">INSERTAR_VERTICE_INTERSECCION_LINEAS</text>

  <line x1="50" y1="300" x2="430" y2="60" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="80" y1="60" x2="400" y2="300" stroke="#2e7d32" stroke-width="3"/>
  <use href="#vert" x="240" y="180"/>

  <text x="240" y="340" text-anchor="middle" fill="#222">Cada línea de los códigos indicados recibe un vértice</text>
  <text x="240" y="358" text-anchor="middle" fill="#222">nuevo en el punto en que cruza a otra.</text>
  <text x="240" y="376" text-anchor="middle" fill="#222">Las líneas no se parten: siguen siendo dos.</text>

  <rect x="16" y="394" width="448" height="38" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#vert" x="36" y="413"/>
  <text x="50" y="417" fill="#222">Vértice que se inserta en cada línea.</text>
</svg>