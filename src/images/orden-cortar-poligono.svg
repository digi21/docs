<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="450" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CORTAR_POLIGONO</text>

  <polygon points="60,65 204.8,65 245.2,235 60,235" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
  <polygon points="204.8,65 420,65 420,235 245.2,235" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="202.4" y1="55" x2="250" y2="255" stroke="#444" stroke-width="2.5"/>
  <use href="#p1" x="110" y="200"/>
  <use href="#p2" x="248.1" y="247"/>

  <text x="240" y="282" text-anchor="middle" fill="#222">1: polígono o línea cerrada. 2: línea de corte.</text>
  <text x="240" y="300" text-anchor="middle" fill="#222">El polígono se divide en varios polígonos con su</text>
  <text x="240" y="318" text-anchor="middle" fill="#222">mismo código, y el original se borra.</text>
  <text x="240" y="336" text-anchor="middle" fill="#222">Con cualquier parámetro se borra también</text>
  <text x="240" y="354" text-anchor="middle" fill="#222">la línea de corte.</text>

  <rect x="16" y="376" width="448" height="62" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="394"/>
  <text x="60" y="398" fill="#222">Selección, en orden.</text>
  <line x1="250" y1="394" x2="286" y2="394" stroke="#444" stroke-width="2.5"/>
  <text x="294" y="398" fill="#222">Línea de corte.</text>
  <rect x="26" y="410" width="36" height="16" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="70" y="422" fill="#222">Polígonos nuevos.</text>
</svg>
