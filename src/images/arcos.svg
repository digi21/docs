<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
    <g id="p4"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4</text></g>
    <g id="p5"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">5</text></g>
    <g id="v"><circle r="5" fill="#1f5fa8"/></g>
  </defs>
  <rect width="640" height="650" fill="#ffffff"/>

  <!-- ARCO -->
  <g transform="translate(0,0)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ARCO</text>
    <path d="M 75.4 149.2 A 90 90 0 0 1 244.6 149.2" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#p1" x="75.4" y="149.2"/>
    <use href="#p2" x="160" y="90"/>
    <use href="#p3" x="244.6" y="149.2"/>
    <text x="160" y="250" text-anchor="middle" fill="#222">1: inicio. 2: punto intermedio. 3: final.</text>
    <text x="160" y="266" text-anchor="middle" fill="#222">Con una línea en curso, el 1 es su último</text>
    <text x="160" y="282" text-anchor="middle" fill="#222">vértice y el arco se añade a esa línea.</text>
  </g>

  <!-- ARCO_TANGENTE -->
  <g transform="translate(320,0)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ARCO_TANGENTE</text>
    <polyline points="30,200 80,120 150,120" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="150" y1="120" x2="230" y2="120" stroke="#888" stroke-dasharray="5 4"/>
    <text x="236" y="124" fill="#888">tangente</text>
    <path d="M 150 120 A 50 50 0 0 1 193.3 195" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#v" x="30" y="200"/>
    <use href="#v" x="80" y="120"/>
    <use href="#v" x="150" y="120"/>
    <text x="150" y="108" text-anchor="middle" fill="#1f5fa8">último vértice</text>
    <use href="#p1" x="193.3" y="195"/>
    <text x="160" y="250" text-anchor="middle" fill="#222">Durante una línea con dos vértices o más:</text>
    <text x="160" y="266" text-anchor="middle" fill="#222">el arco sale del último vértice, tangente al</text>
    <text x="160" y="282" text-anchor="middle" fill="#222">último tramo, y termina en el punto 1.</text>
  </g>

  <line x1="20" y1="298" x2="620" y2="298" stroke="#ddd"/>

  <!-- ACUERDO -->
  <g transform="translate(0,305)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ACUERDO</text>
    <polyline points="128.2,104.3 160,70 193.1,103.1" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
    <polyline points="30,210 128.2,104.3" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <path d="M 128.2 104.3 A 45 45 0 0 1 193.1 103.1" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="193.1,103.1 290,200" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="161.2" y1="134.9" x2="193.1" y2="103.1" stroke="#e67e22" stroke-width="1.5"/>
    <text x="182" y="132" fill="#e67e22" font-weight="bold">radio</text>
    <circle cx="161.2" cy="134.9" r="3" fill="#e67e22"/>
    <text x="160" y="58" text-anchor="middle" fill="#888">vértice original</text>
    <circle cx="128.2" cy="104.3" r="4" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
    <circle cx="193.1" cy="103.1" r="4" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
    <text x="160" y="250" text-anchor="middle" fill="#222">El vértice más cercano al punto de selección</text>
    <text x="160" y="266" text-anchor="middle" fill="#222">se sustituye por un arco tangente a sus dos</text>
    <text x="160" y="282" text-anchor="middle" fill="#222">tramos. El radio se escribe o se mide con 2 puntos.</text>
  </g>

  <!-- MULTIARCO -->
  <g transform="translate(320,305)">
    <text x="160" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">MULTIARCO</text>
    <path d="M 40 150 A 60 60 0 0 1 160 150 A 60 60 0 0 0 280 150" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#p1" x="40" y="150"/>
    <use href="#p2" x="100" y="90"/>
    <use href="#p3" x="160" y="150"/>
    <use href="#p4" x="220" y="210"/>
    <use href="#p5" x="280" y="150"/>
    <text x="160" y="250" text-anchor="middle" fill="#222">Arcos encadenados: el final de un arco (3)</text>
    <text x="160" y="266" text-anchor="middle" fill="#222">es el principio del siguiente, que pide</text>
    <text x="160" y="282" text-anchor="middle" fill="#222">solo su punto intermedio y su final.</text>
  </g>

  <rect x="20" y="618" width="600" height="26" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="631"/>
  <text x="56" y="636" fill="#222">Puntos digitalizados, en orden.</text>
  <circle cx="300" cy="631" r="4" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="312" y="636" fill="#222">Puntos de tangencia del acuerdo.</text>
</svg>
