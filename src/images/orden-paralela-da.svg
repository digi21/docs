<svg xmlns="http://www.w3.org/2000/svg" width="560" height="580" viewBox="0 0 560 580" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="sentido" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="eje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <g id="original">
      <polyline points="30,170 140,110 250,140" fill="none" stroke="#1f5fa8" stroke-width="3"/>
      <line x1="150" y1="112.7" x2="175" y2="119.5" stroke="#1f5fa8" stroke-width="3" marker-end="url(#sentido)"/>
    </g>
    <g id="cursor" stroke="#c0392b" stroke-width="2"><line x1="-9" y1="0" x2="9" y2="0"/><line x1="0" y1="-9" x2="0" y2="9"/></g>
  </defs>  <rect width="560" height="580" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">PARALELA_DA</text>

  <text x="20" y="56" font-weight="bold" fill="#555">Planta</text>
  <g transform="translate(143,30)">
    <use href="#original"/>
    <polyline points="44.4,196.3 143.8,142.1 242.1,169" fill="none" stroke="#e67e22" stroke-width="3"/>
    <line x1="190" y1="125.5" x2="185.8" y2="155" stroke="#555" stroke-width="1.2"/>
    <text x="192" y="150" fill="#555">DA</text>
  </g>
  <text x="280" y="258" text-anchor="middle" fill="#222">Al seleccionar la línea, la paralela se genera a la distancia DA,</text>
  <text x="280" y="274" text-anchor="middle" fill="#222">a la derecha del sentido de digitalización.</text>
  <text x="280" y="290" text-anchor="middle" fill="#222">Con DA negativa, a la izquierda.</text>
  <line x1="16" y1="304" x2="544" y2="304" stroke="#ddd"/>
  <text x="20" y="328" font-weight="bold" fill="#555">Alzado: Z a lo largo de la línea</text>
  <line x1="125" y1="458" x2="125" y2="345" stroke="#777" stroke-width="1.2" marker-end="url(#eje)"/>
  <text x="133" y="354" fill="#777">Z</text>
  <line x1="150" y1="440" x2="410" y2="380" stroke="#1f5fa8" stroke-width="3"/>
  <text x="418" y="384" fill="#1f5fa8">original</text>
  <line x1="150" y1="400" x2="410" y2="340" stroke="#e67e22" stroke-width="3"/>
  <text x="418" y="344" fill="#e67e22">paralela</text>
  <line x1="360" y1="391.5" x2="360" y2="351.5" stroke="#555" stroke-width="1.2"/>
  <text x="368" y="377" fill="#555">DA2</text>
  <text x="280" y="478" text-anchor="middle" fill="#222">A la Z de todos los vértices se le suma DA2 (aquí, positiva).</text>

  <rect x="16" y="510" width="528" height="56" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="32" y1="527" x2="72" y2="527" stroke="#1f5fa8" stroke-width="3" marker-end="url(#sentido)"/>
  <text x="86" y="531.5" fill="#222">Línea original y su sentido de digitalización.</text>
  <line x1="32" y1="549" x2="72" y2="549" stroke="#e67e22" stroke-width="3"/>
  <text x="86" y="553.5" fill="#222">Paralela.</text>
</svg>
