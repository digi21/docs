<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
    <g id="p4"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4</text></g>
  </defs>
  <rect width="480" height="400" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">CEBRA_4P (N = 3)</text>

  <polygon points="90,265 390,235 360,70 120,100" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
  <g fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2">
    <polygon points="90,265 150,259 168,94 120,100"/>
    <polygon points="210,253 270,247 264,82 216,88"/>
    <polygon points="330,241 390,235 360,70 312,76"/>
  </g>
  <use href="#p1" x="90" y="265"/>
  <use href="#p2" x="390" y="235"/>
  <use href="#p3" x="360" y="70"/>
  <use href="#p4" x="120" y="100"/>

  <text x="240" y="300" text-anchor="middle" fill="#222">Cuadrilátero 1-2-3-4. Los lados 1→2 y 4→3 se dividen</text>
  <text x="240" y="317" text-anchor="middle" fill="#222">en 2N−1 partes iguales. Cada franja une una parte de 1→2</text>
  <text x="240" y="334" text-anchor="middle" fill="#222">con la de 4→3 y es una línea cerrada.</text>

  <rect x="15" y="356" width="450" height="34" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="34" y="373"/>
  <text x="50" y="378" fill="#222">Puntos digitalizados, en orden.</text>
  <rect x="250" y="365" width="16" height="16" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="274" y="378" fill="#222">Franja que crea la orden.</text>
</svg>
