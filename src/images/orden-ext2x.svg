<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="420" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">EXT2X</text>

  <line x1="60" y1="230" x2="160" y2="160" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="420" y1="230" x2="320" y2="160" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="160,160 240,104 320,160" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="240" cy="104" r="6" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <use href="#p1" x="110" y="195"/>
  <use href="#p2" x="370" y="195"/>

  <text x="240" y="268" text-anchor="middle" fill="#222">1 y 2: dos líneas. Las dos se prolongan o se recortan</text>
  <text x="240" y="286" text-anchor="middle" fill="#222">por un extremo hasta su intersección. El extremo lo</text>
  <text x="240" y="304" text-anchor="middle" fill="#222">decide la geometría de las líneas, no el punto de</text>
  <text x="240" y="322" text-anchor="middle" fill="#222">selección. Si tienen el mismo código, se unen en una.</text>

  <rect x="16" y="344" width="448" height="62" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="362"/>
  <text x="60" y="366" fill="#222">Selección, en orden.</text>
  <line x1="250" y1="362" x2="286" y2="362" stroke="#1f5fa8" stroke-width="3"/>
  <text x="294" y="366" fill="#222">Líneas seleccionadas.</text>
  <line x1="26" y1="386" x2="62" y2="386" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="70" y="390" fill="#222">Prolongación que se añade.</text>
  <circle cx="268" cy="386" r="6" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="294" y="390" fill="#222">Intersección.</text>
</svg>
