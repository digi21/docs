<svg xmlns="http://www.w3.org/2000/svg" width="480" height="438" viewBox="0 0 480 438" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="438" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">EXT_P</text>

  <line x1="330" y1="55" x2="330" y2="113" stroke="#444" stroke-width="3"/>
  <line x1="330" y1="123" x2="330" y2="235" stroke="#2e7d32" stroke-width="3"/>
  <line x1="60" y1="118" x2="250" y2="118" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="250" y1="118" x2="330" y2="118" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="330" cy="118" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="342" y="122" fill="#222">nodo</text>
  <use href="#p1" x="330" y="190"/>
  <use href="#p2" x="220" y="118"/>

  <text x="240" y="270" text-anchor="middle" fill="#222">1: límite. 2: línea, junto al extremo que se mueve.</text>
  <text x="240" y="288" text-anchor="middle" fill="#222">La línea se estira o se recorta hasta el límite, y el</text>
  <text x="240" y="306" text-anchor="middle" fill="#222">límite se parte en dos en el punto de corte.</text>
  <text x="240" y="324" text-anchor="middle" fill="#222">Las Z de los extremos de la línea no cambian.</text>
  <text x="240" y="342" text-anchor="middle" fill="#222">La orden termina tras una línea.</text>

  <rect x="16" y="364" width="448" height="62" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="382"/>
  <text x="60" y="386" fill="#222">Selección, en orden.</text>
  <circle cx="268" cy="382" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="294" y="386" fill="#222">Punto de corte (nodo).</text>
  <line x1="26" y1="406" x2="44" y2="406" stroke="#444" stroke-width="3"/>
  <line x1="44" y1="406" x2="62" y2="406" stroke="#2e7d32" stroke-width="3"/>
  <text x="70" y="410" fill="#222">Las dos partes del límite.</text>
  <line x1="250" y1="406" x2="286" y2="406" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="294" y="410" fill="#222">Prolongación que se añade.</text>
</svg>
