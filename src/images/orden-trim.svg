<svg xmlns="http://www.w3.org/2000/svg" width="480" height="416" viewBox="0 0 480 416" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="416" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">TRIM</text>

  <line x1="270" y1="55" x2="270" y2="235" stroke="#444" stroke-width="3"/>
  <text x="278" y="232" fill="#444">límite</text>
  <line x1="70" y1="145" x2="270" y2="145" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="270" y1="145" x2="410" y2="145" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <use href="#p1" x="270" y="80"/>
  <use href="#p2" x="350" y="145"/>

  <text x="240" y="270" text-anchor="middle" fill="#222">1: límite. 2: línea, sobre el trozo que se quiere quitar.</text>
  <text x="240" y="288" text-anchor="middle" fill="#222">La línea se parte en los cruces con el límite</text>
  <text x="240" y="306" text-anchor="middle" fill="#222">y se elimina el trozo seleccionado.</text>
  <text x="240" y="324" text-anchor="middle" fill="#222">La orden sigue con el mismo límite hasta pulsar Esc.</text>

  <rect x="16" y="346" width="448" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="364"/>
  <text x="60" y="368" fill="#222">Selección, en orden.</text>
  <line x1="250" y1="364" x2="286" y2="364" stroke="#444" stroke-width="3"/>
  <text x="294" y="368" fill="#222">Límite.</text>
  <line x1="26" y1="386" x2="62" y2="386" stroke="#1f5fa8" stroke-width="3"/>
  <text x="70" y="390" fill="#222">Línea que se recorta.</text>
  <line x1="250" y1="386" x2="286" y2="386" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="294" y="390" fill="#222">Trozo que se elimina.</text>
</svg>
