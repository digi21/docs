<svg xmlns="http://www.w3.org/2000/svg" width="560" height="602" viewBox="0 0 560 602" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="sentido" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="eje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <g id="original">
      <polyline points="30,170 140,110 250,140" fill="none" stroke="#1f5fa8" stroke-width="3"/>
      <line x1="150" y1="112.7" x2="175" y2="119.5" stroke="#1f5fa8" stroke-width="3" marker-end="url(#sentido)"/>
    </g>
    <g id="cursor" stroke="#c0392b" stroke-width="2"><line x1="-9" y1="0" x2="9" y2="0"/><line x1="0" y1="-9" x2="0" y2="9"/></g>
  </defs>  <rect width="560" height="602" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">PARALELA_DINAMICA_PLANO_DIBUJO</text>

  <text x="20" y="56" font-weight="bold" fill="#555">Ventana de dibujo en planta</text>
  <g transform="translate(143,30)">
    <use href="#original"/>
    <polyline points="15.6,143.7 136.2,77.9 257.9,111" fill="none" stroke="#e67e22" stroke-width="3"/>
    <line x1="68.3" y1="115" x2="82.7" y2="141.3" stroke="#555" stroke-width="1.2"/>
    <use href="#cursor" x="68.3" y="115"/>
    <text x="87" y="132.5" fill="#555" font-size="12">d</text>
  </g>

  <text x="280" y="258" text-anchor="middle" fill="#222">La distancia y el lado se miden en el plano de la ventana de dibujo.</text>
  <text x="280" y="274" text-anchor="middle" fill="#222">Con la ventana en planta, la orden funciona como PARALELA_DINAMICA</text>
  <text x="280" y="290" text-anchor="middle" fill="#222">y la paralela conserva la Z de la línea original.</text>
  <line x1="16" y1="304" x2="544" y2="304" stroke="#ddd"/>
  <text x="20" y="328" font-weight="bold" fill="#555">Ventana de dibujo en alzado</text>
  <line x1="125" y1="458" x2="125" y2="345" stroke="#777" stroke-width="1.2" marker-end="url(#eje)"/>
  <text x="133" y="354" fill="#777">Z</text>
  <line x1="125" y1="458" x2="440" y2="458" stroke="#777" stroke-width="1.2" marker-end="url(#eje)"/>
  <text x="446" y="462" fill="#777">X</text>
  <line x1="150" y1="440" x2="410" y2="380" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="180" y1="433.1" x2="205" y2="427.3" stroke="#1f5fa8" stroke-width="3" marker-end="url(#sentido)"/>
  <line x1="143.25" y1="410.8" x2="403.25" y2="350.8" stroke="#e67e22" stroke-width="3"/>
  <line x1="280" y1="379.2" x2="286.75" y2="408.4" stroke="#555" stroke-width="1.2"/>
  <use href="#cursor" x="280" y="379.2"/>
  <text x="270" y="402" fill="#555" text-anchor="end">d</text>
  <text x="280" y="478" text-anchor="middle" fill="#222">Con la ventana en alzado, la paralela se desplaza en el plano vertical</text>
  <text x="280" y="494" text-anchor="middle" fill="#222">de la ventana: cambia su Z.</text>

  <rect x="16" y="510" width="528" height="78" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="32" y1="527" x2="72" y2="527" stroke="#1f5fa8" stroke-width="3" marker-end="url(#sentido)"/>
  <text x="86" y="531.5" fill="#222">Línea original y su sentido de digitalización.</text>
  <line x1="32" y1="549" x2="72" y2="549" stroke="#e67e22" stroke-width="3"/>
  <text x="86" y="553.5" fill="#222">Paralela.</text>
  <use href="#cursor" x="52" y="571"/>
  <text x="86" y="575.5" fill="#222">Punto digitalizado (posición del cursor al pinchar).</text>
</svg>
