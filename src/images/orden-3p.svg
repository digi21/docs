<svg xmlns="http://www.w3.org/2000/svg" width="480" height="412" viewBox="0 0 480 412" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>  <rect width="480" height="412" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">3P</text>

  <g transform="translate(100,30)">
    <polygon points="80,205 230,135 186.8,42.5 36.8,112.5" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
    <line x1="230" y1="135" x2="80" y2="205" stroke="#1f5fa8" stroke-width="4"/>
    <use href="#p1" x="80" y="205"/>
    <use href="#p2" x="230" y="135"/>
    <use href="#p3" x="104" y="81"/>
  </g>
  <text x="240" y="284" text-anchor="middle" fill="#222">1 y 2: esquinas de un lado. 3: cualquier punto del lado</text>
  <text x="240" y="300" text-anchor="middle" fill="#222">opuesto, no necesariamente una esquina; fija el otro lado.</text>

  <rect x="16" y="320" width="448" height="78" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="52" y="337"/>
  <text x="86" y="341.5" fill="#222">Puntos digitalizados, en orden.</text>
  <line x1="32" y1="359" x2="72" y2="359" stroke="#1f5fa8" stroke-width="4"/>
  <text x="86" y="363.5" fill="#222">Lado definido por los puntos 1 y 2.</text>
  <rect x="34" y="374" width="36" height="14" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
  <text x="86" y="385.5" fill="#222">Rectángulo: línea cerrada de 5 vértices.</text>
</svg>
