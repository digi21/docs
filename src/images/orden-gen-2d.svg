<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" viewBox="0 0 540 320" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="540" height="320" fill="#ffffff"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">GEN_2D</text>

  <!-- Planta -->
  <text x="135" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Planta (XY)</text>
  <line x1="30" y1="140" x2="240" y2="140" stroke="#1f5fa8" stroke-width="3"/>
  <circle cx="30" cy="140" r="6" fill="#1f5fa8"/>
  <circle cx="135" cy="140" r="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <path d="M 129 134 L 141 146 M 141 134 L 129 146" stroke="#c0392b" stroke-width="2"/>
  <circle cx="240" cy="140" r="6" fill="#1f5fa8"/>
  <text x="30" y="125" text-anchor="middle" fill="#222">A</text>
  <text x="135" y="125" text-anchor="middle" fill="#c0392b">P</text>
  <text x="240" y="125" text-anchor="middle" fill="#222">B</text>
  <text x="135" y="182" text-anchor="middle" fill="#222">En planta, P está sobre la</text>
  <text x="135" y="198" text-anchor="middle" fill="#222">recta A-B: distancia 0.</text>

  <line x1="270" y1="44" x2="270" y2="206" stroke="#ccc" stroke-width="1"/>

  <!-- Alzado -->
  <text x="405" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Alzado (Z)</text>
  <polyline points="300,160 405,90 510,160" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="300" y1="160" x2="510" y2="160" stroke="#1f5fa8" stroke-width="3"/>
  <circle cx="300" cy="160" r="6" fill="#1f5fa8"/>
  <circle cx="405" cy="90" r="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <path d="M 399 84 L 411 96 M 411 84 L 399 96" stroke="#c0392b" stroke-width="2"/>
  <circle cx="510" cy="160" r="6" fill="#1f5fa8"/>
  <text x="300" y="182" text-anchor="middle" fill="#222">A</text>
  <text x="405" y="78" text-anchor="middle" fill="#c0392b">P</text>
  <text x="510" y="182" text-anchor="middle" fill="#222">B</text>
  <line x1="405" y1="97" x2="405" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <text x="413" y="134" fill="#c0392b">Δz</text>
  <text x="405" y="198" text-anchor="middle" fill="#222">Δz no interviene en el cálculo.</text>

  <rect x="20" y="222" width="500" height="86" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <text x="36" y="246" fill="#222">GEN_2D mide solo en XY: la distancia de P a A-B es 0 y su ángulo</text>
  <text x="36" y="264" fill="#222">es 0, así que P se elimina, sea cual sea Δz.</text>
  <line x1="36" y1="290" x2="66" y2="290" stroke="#aaa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="74" y="294" fill="#222">Línea original: A, P y B.</text>
  <line x1="250" y1="290" x2="280" y2="290" stroke="#1f5fa8" stroke-width="3"/>
  <text x="288" y="294" fill="#222">Línea generalizada: A y B.</text>
</svg>
