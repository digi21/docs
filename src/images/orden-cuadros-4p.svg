<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
    <g id="p4"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4</text></g>
  </defs>
  <rect width="480" height="420" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">CUADROS_4P (3 × 4)</text>

  <g stroke="#1f5fa8" stroke-width="2">
    <line x1="90" y1="255" x2="390" y2="232.5"/><line x1="97.5" y1="197.55" x2="382.5" y2="175.05"/>
    <line x1="105" y1="139.95" x2="375" y2="117.45"/><line x1="112.5" y1="82.5" x2="367.5" y2="60"/>
    <line x1="90" y1="255" x2="112.5" y2="82.5"/><line x1="165" y1="249.375" x2="176.25" y2="76.875"/>
    <line x1="240" y1="243.75" x2="240" y2="71.25"/><line x1="315" y1="238.125" x2="303.75" y2="65.625"/>
    <line x1="390" y1="232.5" x2="367.5" y2="60"/>
  </g>
  <use href="#p1" x="90" y="255"/>
  <use href="#p2" x="390" y="232.5"/>
  <use href="#p3" x="367.5" y="60"/>
  <use href="#p4" x="112.5" y="82.5"/>

  <text x="240" y="292" text-anchor="middle" fill="#222">1-2: la base. 3 y 4 cierran el cuadrilátero 1-2-3-4. Los lados</text>
  <text x="240" y="309" text-anchor="middle" fill="#222">1-2 y 4-3 se dividen en 4 partes, y los lados 1-4 y 2-3, en 3.</text>
  <text x="240" y="326" text-anchor="middle" fill="#222">Con 1 división en un sentido, solo salen escalones en el otro.</text>
  <text x="240" y="343" text-anchor="middle" fill="#222">Las divisiones se escriben en la barra de estado.</text>

  <rect x="15" y="370" width="450" height="34" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="34" y="387"/>
  <text x="50" y="392" fill="#222">Puntos digitalizados, en orden.</text>
</svg>
