<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
  </defs>
  <rect width="480" height="400" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SIGUIENTE_SEGMENTO_VERTICAL_HACIA_ARRIBA</text>

  <text x="420" y="58" text-anchor="end" fill="#777">Vista en alzado</text>
  <line x1="60" y1="252" x2="60" y2="60" stroke="#bbb"/><text x="52" y="72" fill="#999" text-anchor="end">Z</text>
  <polyline points="75,215 120,215" fill="none" stroke="#999" stroke-width="2.5"/>
  <polyline points="120,215 360,215 360,80" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <circle cx="120" cy="215" r="4" fill="#555"/><text x="112" y="240" fill="#555">último vértice</text>
  <circle cx="360" cy="215" r="5" fill="#e67e22"/>
  <text x="350" y="205" text-anchor="end" fill="#e67e22">X e Y de 1, Z del último vértice</text>
  <use href="#p1" x="360" y="80"/>

  <text x="240" y="284" text-anchor="middle" fill="#222">Al digitalizar 1, la orden añade dos vértices: primero uno con</text>
  <text x="240" y="301" text-anchor="middle" fill="#222">la X e Y de 1 y la Z del último vértice, y después 1.</text>
  <text x="240" y="318" text-anchor="middle" fill="#222">El segmento vertical queda al final.</text>

  <rect x="15" y="336" width="450" height="54" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="30" y1="354" x2="60" y2="354" stroke="#999" stroke-width="2.5"/>
  <text x="68" y="358" fill="#222">Línea que se está digitalizando.</text>
  <use href="#p1" x="290" y="354"/>
  <text x="304" y="358" fill="#222">Punto digitalizado.</text>
  <circle cx="45" cy="375" r="5" fill="#e67e22"/>
  <text x="68" y="379" fill="#222">Vértice que añade la orden.</text>
</svg>
