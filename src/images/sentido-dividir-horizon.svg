<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>

  <!-- CAMB_SEN -->
  <g transform="translate(0,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CAMB_SEN</text>
    <text x="20" y="52" fill="#777">antes</text>
    <line x1="30" y1="80" x2="250" y2="80" stroke="#999" stroke-width="2.5" marker-end="url(#flechaGris)"/>
    <g stroke="#999" stroke-width="1.5">
      <line x1="50" y1="80" x2="50" y2="70"/><line x1="80" y1="80" x2="80" y2="70"/><line x1="110" y1="80" x2="110" y2="70"/>
      <line x1="140" y1="80" x2="140" y2="70"/><line x1="170" y1="80" x2="170" y2="70"/><line x1="200" y1="80" x2="200" y2="70"/>
      <line x1="230" y1="80" x2="230" y2="70"/>
    </g>
    <text x="30" y="98" text-anchor="middle" fill="#777">1</text><text x="250" y="98" text-anchor="middle" fill="#777">n</text>
    <text x="20" y="132" fill="#1f5fa8">después</text>
    <line x1="250" y1="160" x2="30" y2="160" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha)"/>
    <g stroke="#1f5fa8" stroke-width="1.5">
      <line x1="50" y1="160" x2="50" y2="170"/><line x1="80" y1="160" x2="80" y2="170"/><line x1="110" y1="160" x2="110" y2="170"/>
      <line x1="140" y1="160" x2="140" y2="170"/><line x1="170" y1="160" x2="170" y2="170"/><line x1="200" y1="160" x2="200" y2="170"/>
      <line x1="230" y1="160" x2="230" y2="170"/>
    </g>
    <text x="250" y="150" text-anchor="middle" fill="#1f5fa8">1</text><text x="30" y="150" text-anchor="middle" fill="#1f5fa8">n</text>
    <text x="140" y="200" text-anchor="middle" fill="#222">Invierte el orden de los vértices. Un</text>
    <text x="140" y="215" text-anchor="middle" fill="#222">patrón lateral pasa al otro lado.</text>
  </g>

  <!-- CAMB_SEN_SUBE -->
  <g transform="translate(280,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CAMB_SEN_SUBE</text>
    <text x="20" y="52" fill="#777">antes</text>
    <line x1="30" y1="80" x2="250" y2="80" stroke="#999" stroke-width="2.5" marker-end="url(#flechaGris)"/>
    <text x="30" y="98" fill="#777">1: z 120</text><text x="250" y="98" text-anchor="end" fill="#777">n: z 100</text>
    <text x="20" y="132" fill="#1f5fa8">después</text>
    <line x1="250" y1="160" x2="30" y2="160" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha)"/>
    <text x="250" y="150" text-anchor="end" fill="#1f5fa8">1: z 100</text><text x="30" y="150" fill="#1f5fa8">n: z 120</text>
    <text x="140" y="200" text-anchor="middle" fill="#222">Invierte la línea si su primer vértice</text>
    <text x="140" y="215" text-anchor="middle" fill="#222">tiene más Z que el último. Si no, no cambia.</text>
  </g>

  <!-- CAMB_SEN_BAJA -->
  <g transform="translate(560,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CAMB_SEN_BAJA</text>
    <text x="20" y="52" fill="#777">antes</text>
    <line x1="30" y1="80" x2="250" y2="80" stroke="#999" stroke-width="2.5" marker-end="url(#flechaGris)"/>
    <text x="30" y="98" fill="#777">1: z 100</text><text x="250" y="98" text-anchor="end" fill="#777">n: z 120</text>
    <text x="20" y="132" fill="#1f5fa8">después</text>
    <line x1="250" y1="160" x2="30" y2="160" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha)"/>
    <text x="250" y="150" text-anchor="end" fill="#1f5fa8">1: z 120</text><text x="30" y="150" fill="#1f5fa8">n: z 100</text>
    <text x="140" y="200" text-anchor="middle" fill="#222">Invierte la línea si su primer vértice</text>
    <text x="140" y="215" text-anchor="middle" fill="#222">tiene menos Z que el último. Si no, no cambia.</text>
  </g>

  <line x1="20" y1="236" x2="820" y2="236" stroke="#ddd"/>

  <!-- DIVIDIR -->
  <g transform="translate(0,246)">
    <text x="210" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DIVIDIR</text>
    <polyline points="40,160 210,108 370,152" fill="none" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha)"/>
    <g fill="#2e7d32" font-size="15" font-weight="bold" text-anchor="middle">
      <text transform="translate(84,147) rotate(-17)" y="-5">A</text>
      <text transform="translate(147,127) rotate(-17)" y="-5">A</text>
      <text transform="translate(222,111) rotate(15)" y="-5">A</text>
      <text transform="translate(285,129) rotate(15)" y="-5">A</text>
      <text transform="translate(348,146) rotate(15)" y="-5">A</text>
    </g>
    <g stroke="#2e7d32" stroke-width="1.5">
      <circle cx="84" cy="147" r="2.5" fill="#2e7d32"/><circle cx="147" cy="127" r="2.5" fill="#2e7d32"/>
      <circle cx="222" cy="111" r="2.5" fill="#2e7d32"/><circle cx="285" cy="129" r="2.5" fill="#2e7d32"/>
      <circle cx="348" cy="146" r="2.5" fill="#2e7d32"/>
    </g>
    <text x="58" y="178" fill="#555">DA</text>
    <text x="108" y="160" fill="#555">DA2</text>
    <text x="40" y="180" text-anchor="middle" fill="#555">1</text>
    <text x="210" y="205" text-anchor="middle" fill="#222">El primer texto o símbolo va a DA del primer vértice; los siguientes, cada</text>
    <text x="210" y="220" text-anchor="middle" fill="#222">DA2 medido sobre la línea. Cada uno gira con el tramo en el que cae, o</text>
    <text x="210" y="235" text-anchor="middle" fill="#222">toma un ángulo fijo. Altura AT y justificación JT.</text>
  </g>

  <!-- HORIZON -->
  <g transform="translate(420,246)">
    <text x="210" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">HORIZON</text>
    <text x="20" y="56" fill="#555">Ancho = 0</text>
    <line x1="30" y1="80" x2="390" y2="80" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <g stroke="#1f5fa8" stroke-width="3">
      <line x1="30" y1="80" x2="90" y2="80"/><line x1="120" y1="80" x2="180" y2="80"/>
      <line x1="210" y1="80" x2="270" y2="80"/><line x1="300" y1="80" x2="360" y2="80"/>
    </g>
    <line x1="30" y1="92" x2="90" y2="92" stroke="#555"/><text x="60" y="105" text-anchor="middle" fill="#555">largo</text>
    <line x1="90" y1="92" x2="120" y2="92" stroke="#c0392b"/><text x="105" y="118" text-anchor="middle" fill="#c0392b">espacio</text>
    <text x="20" y="140" fill="#555">Ancho &gt; 0</text>
    <line x1="30" y1="155" x2="390" y2="155" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
    <g fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2">
      <rect x="30" y="155" width="60" height="14"/><rect x="120" y="155" width="60" height="14"/>
      <rect x="210" y="155" width="60" height="14"/><rect x="300" y="155" width="60" height="14"/>
    </g>
    <line x1="380" y1="155" x2="380" y2="169" stroke="#555"/><text x="386" y="167" fill="#555">ancho</text>
    <text x="210" y="205" text-anchor="middle" fill="#222">Las líneas abiertas del código se sustituyen por trazos de longitud</text>
    <text x="210" y="220" text-anchor="middle" fill="#222">largo separados por espacio. Con ancho, cada trazo es un rectángulo</text>
    <text x="210" y="235" text-anchor="middle" fill="#222">cerrado a la derecha del sentido. El trazo final incompleto no se añade.</text>
  </g>

  <rect x="20" y="500" width="800" height="48" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="36" y1="516" x2="66" y2="516" stroke="#999" stroke-width="2.5"/>
  <text x="74" y="520" fill="#222">Línea original. La flecha marca el sentido de digitalización, del vértice 1 al n.</text>
  <line x1="36" y1="536" x2="66" y2="536" stroke="#1f5fa8" stroke-width="2.5"/>
  <text x="74" y="540" fill="#222">Resultado.</text>
</svg>
