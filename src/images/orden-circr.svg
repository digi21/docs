<svg xmlns="http://www.w3.org/2000/svg" width="460" height="320" viewBox="0 0 460 320" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="460" height="320" fill="#ffffff"/>

  <text x="230" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CIRCR</text>

  <circle cx="135" cy="130" r="80" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="135" y1="130" x2="215" y2="130" stroke="#888" stroke-dasharray="5 4"/>
  <text x="175" y="123" text-anchor="middle" fill="#555">radio</text>
  <use href="#p1" x="135" y="130"/>

  <circle cx="325" cy="130" r="80" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="325" y1="130" x2="405" y2="130" stroke="#888" stroke-dasharray="5 4"/>
  <text x="365" y="123" text-anchor="middle" fill="#555">radio</text>
  <use href="#p2" x="325" y="130"/>

  <text x="230" y="236" text-anchor="middle" fill="#222">Cada punto digitalizado (1, 2…) es el centro de una circunferencia</text>
  <text x="230" y="252" text-anchor="middle" fill="#222">nueva. El radio se escribe en la barra de estado o se pasa como</text>
  <text x="230" y="268" text-anchor="middle" fill="#222">parámetro. La orden sigue activa hasta que se termina.</text>

  <rect x="20" y="280" width="420" height="32" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="296"/>
  <text x="56" y="301" fill="#222">Puntos digitalizados, en orden.</text>
  <circle cx="262" cy="296" r="9" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
  <text x="278" y="301" fill="#222">Línea cerrada creada.</text>
</svg>
