<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="viejo"><circle r="5" fill="#fff" stroke="#999" stroke-width="1.5"/></g>
    <g id="nuevo"><circle r="5.5" fill="#e67e22"/></g>
  </defs>
  <rect width="480" height="490" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">JUNTAR_VERTICES_CERCANOS</text>
  <text x="240" y="52" text-anchor="middle" fill="#555" font-size="12">distancia = 0,05</text>

  <!-- geometría antes -->
  <polyline points="90,80 230,160 242,290" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="400,70 242,172 410,290" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- geometría después -->
  <polyline points="90,80 230,160 230,290" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="400,70 230,160 410,290" fill="none" stroke="#1f5fa8" stroke-width="3"/>

  <use href="#viejo" x="242" y="172"/><use href="#viejo" x="242" y="290"/>
  <use href="#nuevo" x="230" y="160"/><use href="#nuevo" x="230" y="290"/>

  <text x="218" y="194" text-anchor="end" fill="#555" font-size="12">x 100,03 → 100</text>
  <text x="218" y="210" text-anchor="end" fill="#555" font-size="12">y 49,97 → 50</text>
  <text x="218" y="294" text-anchor="end" fill="#555" font-size="12">x 100,03 → 100</text>
  <text x="218" y="310" text-anchor="end" fill="#555" font-size="12">(la y no cambia)</text>

  <text x="240" y="352" text-anchor="middle" fill="#222">La orden pide una distancia y recorre todas las entidades</text>
  <text x="240" y="370" text-anchor="middle" fill="#222">del archivo activo. Cada X que está a menos de esa</text>
  <text x="240" y="388" text-anchor="middle" fill="#222">distancia de una X ya procesada toma ese valor; igual con la Y.</text>
  <text x="240" y="406" text-anchor="middle" fill="#222">La X y la Y se ajustan por separado. La Z no cambia.</text>

  <rect x="16" y="422" width="448" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#viejo" x="34" y="440"/>
  <text x="46" y="444" fill="#222">Posición original del vértice.</text>
  <use href="#nuevo" x="264" y="440"/>
  <text x="276" y="444" fill="#222">Posición nueva.</text>
  <line x1="24" y1="464" x2="50" y2="464" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="58" y="468" fill="#222">Geometría antes de la orden.</text>
</svg>
