<svg xmlns="http://www.w3.org/2000/svg" width="480" height="380" viewBox="0 0 480 380" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="480" height="380" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ESCALERA (N = 4)</text>

  <g stroke="#1f5fa8" stroke-width="2">
    <line x1="90" y1="240" x2="390" y2="240"/><line x1="90" y1="195" x2="390" y2="195"/>
    <line x1="90" y1="150" x2="390" y2="150"/><line x1="90" y1="105" x2="390" y2="105"/>
    <line x1="90" y1="60" x2="390" y2="60"/>
    <line x1="90" y1="60" x2="90" y2="240"/><line x1="390" y1="60" x2="390" y2="240"/>
  </g>
  <g fill="#555" font-size="12">
    <text x="400" y="222">peldaño 1</text><text x="400" y="177">peldaño 2</text>
    <text x="400" y="132">peldaño 3</text><text x="400" y="87">peldaño 4</text>
  </g>
  <use href="#p1" x="90" y="240"/>
  <use href="#p2" x="390" y="240"/>
  <use href="#p3" x="210" y="60"/>

  <text x="240" y="278" text-anchor="middle" fill="#222">1-2: la base, primer peldaño. 3: un punto del último.</text>
  <text x="240" y="295" text-anchor="middle" fill="#222">La orden traza N + 1 líneas paralelas a 1-2, a la misma</text>
  <text x="240" y="312" text-anchor="middle" fill="#222">distancia entre sí, y los dos laterales.</text>

  <rect x="15" y="334" width="450" height="34" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="34" y="351"/>
  <text x="50" y="356" fill="#222">Puntos digitalizados, en orden. N se escribe en la barra de estado.</text>
</svg>
