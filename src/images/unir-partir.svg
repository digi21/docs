<svg xmlns="http://www.w3.org/2000/svg" width="840" height="610" viewBox="0 0 840 610" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="p2"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text></g>
    <g id="nodo"><circle r="5" fill="#fff" stroke="#222" stroke-width="2"/></g>
    <g id="vert"><rect x="-4" y="-4" width="8" height="8" fill="#e67e22"/></g>
  </defs>
  <rect width="840" height="610" fill="#ffffff"/>

  <!-- UNIR -->
  <g transform="translate(0,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">UNIR</text>
    <polyline points="20,150 60,110 100,100" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="140,108 200,95 250,140" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="100" y1="100" x2="140" y2="108" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
    <use href="#p1" x="85" y="128"/>
    <use href="#p2" x="160" y="128"/>
    <line x1="85" y1="120" x2="88" y2="105" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="160" y1="120" x2="158" y2="107" stroke="#c0392b" stroke-width="1.5"/>
    <text x="140" y="200" text-anchor="middle" fill="#222">1 y 2: las dos líneas, junto a los extremos</text>
    <text x="140" y="216" text-anchor="middle" fill="#222">que se unen. Resulta una sola línea; si hay</text>
    <text x="140" y="232" text-anchor="middle" fill="#222">hueco entre los extremos, un tramo los une.</text>
  </g>

  <!-- UNIR_XYZ -->
  <g transform="translate(280,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">UNIR_XYZ=códigos</text>
    <polyline points="20,140 90,110 140,110" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="140,110 200,80 255,90" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="140,110 190,160 250,170" fill="none" stroke="#7f8c8d" stroke-width="3"/>
    <use href="#nodo" x="140" y="110"/>
    <text x="95" y="102" fill="#1f5fa8">z = 100</text>
    <text x="196" y="72" fill="#1f5fa8">z = 100</text>
    <text x="196" y="150" fill="#7f8c8d">z = 104</text>
    <text x="140" y="200" text-anchor="middle" fill="#222">Une las líneas de esos códigos cuyos</text>
    <text x="140" y="216" text-anchor="middle" fill="#222">extremos coinciden también en Z: las dos</text>
    <text x="140" y="232" text-anchor="middle" fill="#222">azules se unen; la gris no.</text>
  </g>

  <!-- UNIR_LINEAS_TABLA -->
  <g transform="translate(560,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">UNIR_LINEAS_TABLA</text>
    <polyline points="15,130 55,100 90,105" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="90,105 120,140 130,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#nodo" x="90" y="105"/>
    <text x="70" y="85" text-anchor="middle" fill="#2e7d32">2 líneas: se unen</text>
    <polyline points="160,150 200,110" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="200,110 260,100" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="200,110 220,55" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <use href="#nodo" x="200" y="110"/>
    <text x="215" y="148" text-anchor="middle" fill="#c0392b">3 líneas: no</text>
    <text x="140" y="200" text-anchor="middle" fill="#222">Une las líneas del mismo código cuando a</text>
    <text x="140" y="216" text-anchor="middle" fill="#222">su nodo no llegan más de dos entidades</text>
    <text x="140" y="232" text-anchor="middle" fill="#222">con ese código.</text>
  </g>

  <line x1="20" y1="256" x2="820" y2="256" stroke="#ddd"/>

  <!-- PARTIR_LINEAS -->
  <g transform="translate(0,266)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">PARTIR_LINEAS(_VISIBLES)</text>
    <line x1="30" y1="150" x2="140" y2="100" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="140" y1="100" x2="250" y2="50" stroke="#2e7d32" stroke-width="3"/>
    <line x1="60" y1="50" x2="140" y2="100" stroke="#8e44ad" stroke-width="3"/>
    <line x1="140" y1="100" x2="220" y2="150" stroke="#e67e22" stroke-width="3"/>
    <use href="#nodo" x="140" y="100"/>
    <text x="140" y="200" text-anchor="middle" fill="#222">Las líneas se parten en sus cruces: dos</text>
    <text x="140" y="216" text-anchor="middle" fill="#222">líneas que se cruzan dan cuatro (un color</text>
    <text x="140" y="232" text-anchor="middle" fill="#222">por línea). Con códigos o solo las visibles.</text>
  </g>

  <!-- INSERTAR_VERTICE_INTERSECCION_LINEAS -->
  <g transform="translate(280,266)">
    <text x="140" y="16" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">INSERTAR_VERTICE_</text><text x="140" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">INTERSECCION_LINEAS</text>
    <line x1="30" y1="150" x2="250" y2="50" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="60" y1="50" x2="220" y2="150" stroke="#2e7d32" stroke-width="3"/>
    <use href="#vert" x="140" y="100"/>
    <text x="140" y="200" text-anchor="middle" fill="#222">Cada línea recibe un vértice nuevo en el</text>
    <text x="140" y="216" text-anchor="middle" fill="#222">cruce, pero no se parte: siguen siendo dos</text>
    <text x="140" y="232" text-anchor="middle" fill="#222">líneas. También _VISIBLES.</text>
  </g>

  <!-- INSERTAR_VERTICE_INTERSECCION_LINEA_PUNTO -->
  <g transform="translate(560,266)">
    <text x="140" y="16" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">INSERTAR_VERTICE_</text><text x="140" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">INTERSECCION_LINEA_PUNTO</text>
    <polyline points="20,140 130,90 260,110" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <circle cx="78" cy="102" r="20" fill="none" stroke="#999" stroke-dasharray="3 3"/>
    <circle cx="78" cy="102" r="4" fill="#2e7d32"/>
    <line x1="78" y1="102" x2="81.6" y2="113.8" stroke="#555" stroke-dasharray="2 2"/>
    <use href="#vert" x="81.6" y="113.8"/>
    <circle cx="205" cy="60" r="20" fill="none" stroke="#999" stroke-dasharray="3 3"/>
    <circle cx="205" cy="60" r="4" fill="#2e7d32"/>
    <text x="180" y="52" fill="#777" text-anchor="end">tolerancia</text>
    <text x="140" y="200" text-anchor="middle" fill="#222">Si un punto queda a menos de la tolerancia</text>
    <text x="140" y="216" text-anchor="middle" fill="#222">de una línea o polígono, se inserta un vértice</text>
    <text x="140" y="232" text-anchor="middle" fill="#222">en su proyección. El punto no se mueve.</text>
  </g>

  <rect x="20" y="520" width="800" height="80" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="38" y="540"/>
  <text x="52" y="544" fill="#222">Puntos de selección, en orden.</text>
  <line x1="300" y1="540" x2="340" y2="540" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="348" y="544" fill="#222">Tramo que se añade al unir.</text>
  <use href="#nodo" x="580" y="540"/>
  <text x="592" y="544" fill="#222">Nodo.</text>
  <use href="#vert" x="38" y="568"/>
  <text x="52" y="572" fill="#222">Vértice que se inserta.</text>
  <circle cx="300" cy="568" r="4" fill="#2e7d32"/>
  <text x="312" y="572" fill="#222">Entidad de tipo punto.</text>
  <text x="38" y="592" fill="#222">UNIR_XYZ, UNIR_LINEAS_TABLA, PARTIR_LINEAS e INSERTAR_VERTICE_* actúan a la vez sobre todo el archivo de dibujo.</text>
</svg>
