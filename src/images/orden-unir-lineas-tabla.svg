  <text x="240" y="336" text-anchor="middle" fill="#222">Une las líneas de los códigos indicados cuando a su nodo</text>
  <text x="240" y="354" text-anchor="middle" fill="#222">llegan solo dos entidades de esos códigos.</text>

  <rect x="16" y="372" width="448" height="38" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#nodo" x="36" y="391"/>
  <text x="50" y="395" fill="#222">Nodo: extremos con la misma X e Y.</text>
