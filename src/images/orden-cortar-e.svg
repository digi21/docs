<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
  </defs>
  <rect width="480" height="420" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CORTAR_E</text>

  <polyline points="60,220 170,120 270,138.3" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="270,138.3 400,162" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="270" cy="138.3" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <use href="#p1" x="270" y="104"/>
  <line x1="270" y1="114" x2="270" y2="130" stroke="#c0392b" stroke-width="2"/>

  <text x="240" y="256" text-anchor="middle" fill="#222">1: punto sobre la línea. La línea se parte en dos en</text>
  <text x="240" y="274" text-anchor="middle" fill="#222">ese punto, y las dos líneas conservan el código.</text>
  <text x="240" y="292" text-anchor="middle" fill="#222">La Z del punto de corte se interpola en el tramo.</text>
  <text x="240" y="310" text-anchor="middle" fill="#222">Si el punto es el primer o el último vértice,</text>
  <text x="240" y="328" text-anchor="middle" fill="#222">la orden termina sin cambios.</text>

  <rect x="16" y="350" width="448" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="368"/>
  <text x="60" y="372" fill="#222">Selección.</text>
  <circle cx="268" cy="368" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="294" y="372" fill="#222">Punto de corte.</text>
  <line x1="26" y1="390" x2="62" y2="390" stroke="#1f5fa8" stroke-width="3"/>
  <text x="70" y="394" fill="#222">Primera línea nueva.</text>
  <line x1="250" y1="390" x2="286" y2="390" stroke="#2e7d32" stroke-width="3"/>
  <text x="294" y="394" fill="#222">Segunda línea nueva.</text>
</svg>
