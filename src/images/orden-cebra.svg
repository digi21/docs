<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="480" height="400" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">CEBRA (N = 3)</text>

  <rect x="90" y="60" width="300" height="165" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
  <g fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2">
    <rect x="90" y="60" width="60" height="165"/>
    <rect x="210" y="60" width="60" height="165"/>
    <rect x="330" y="60" width="60" height="165"/>
  </g>
  <use href="#p1" x="90" y="225"/>
  <use href="#p2" x="390" y="225"/>
  <use href="#p3" x="255" y="60"/>

  <g stroke="#555" stroke-width="1">
    <line x1="90" y1="250" x2="390" y2="250"/>
    <line x1="90" y1="244" x2="90" y2="256"/><line x1="150" y1="244" x2="150" y2="256"/>
    <line x1="210" y1="244" x2="210" y2="256"/><line x1="270" y1="244" x2="270" y2="256"/>
    <line x1="330" y1="244" x2="330" y2="256"/><line x1="390" y1="244" x2="390" y2="256"/>
  </g>
  <text x="240" y="273" text-anchor="middle" fill="#555">1→2 en 2N−1 = 5 partes iguales</text>

  <text x="240" y="304" text-anchor="middle" fill="#222">1-2: un lado del paso de cebra. 3: un punto del lado opuesto.</text>
  <text x="240" y="321" text-anchor="middle" fill="#222">La orden crea N franjas separadas por N−1 huecos.</text>
  <text x="240" y="338" text-anchor="middle" fill="#222">Cada franja es una línea cerrada. N se escribe en la barra de estado.</text>

  <rect x="15" y="356" width="450" height="34" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="34" y="373"/>
  <text x="50" y="378" fill="#222">Puntos digitalizados, en orden.</text>
  <rect x="250" y="365" width="16" height="16" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="274" y="378" fill="#222">Franja que crea la orden.</text>
</svg>
