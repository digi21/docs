  <text x="230" y="214" text-anchor="middle" fill="#222">La línea es la spline cúbica que pasa por los puntos</text>
  <text x="230" y="230" text-anchor="middle" fill="#222">digitalizados, con 10 vértices por tramo. Mientras se</text>
  <text x="230" y="246" text-anchor="middle" fill="#222">digitaliza, la spline se recalcula con cada punto y con</text>
  <text x="230" y="262" text-anchor="middle" fill="#222">la posición del cursor.</text>

  <rect x="20" y="276" width="420" height="54" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
