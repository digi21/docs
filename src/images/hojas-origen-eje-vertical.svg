<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="cruz" stroke="#2e7d32" stroke-width="1.5"><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/></g>
    <g id="cruzRoja" stroke="#c0392b" stroke-width="2"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/></g>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <rect width="840" height="560" fill="#ffffff"/>

  <!-- HOJA -->
  <g transform="translate(0,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">HOJA</text>
    <rect x="40" y="50" width="200" height="120" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
    <use href="#cruz" x="80" y="90"/><use href="#cruz" x="120" y="90"/><use href="#cruz" x="160" y="90"/><use href="#cruz" x="200" y="90"/>
    <use href="#cruz" x="80" y="130"/><use href="#cruz" x="120" y="130"/><use href="#cruz" x="160" y="130"/><use href="#cruz" x="200" y="130"/>
    <g stroke="#2e7d32" stroke-width="1.5">
      <line x1="80" y1="170" x2="80" y2="164"/><line x1="120" y1="170" x2="120" y2="164"/><line x1="160" y1="170" x2="160" y2="164"/><line x1="200" y1="170" x2="200" y2="164"/>
      <line x1="80" y1="50" x2="80" y2="56"/><line x1="120" y1="50" x2="120" y2="56"/><line x1="160" y1="50" x2="160" y2="56"/><line x1="200" y1="50" x2="200" y2="56"/>
      <line x1="40" y1="90" x2="46" y2="90"/><line x1="40" y1="130" x2="46" y2="130"/>
      <line x1="240" y1="90" x2="234" y2="90"/><line x1="240" y1="130" x2="234" y2="130"/>
    </g>
    <g fill="#555" font-size="10" text-anchor="middle">
      <text x="80" y="182">400</text><text x="120" y="182">500</text><text x="160" y="182">600</text><text x="200" y="182">700</text>
    </g>
    <g fill="#555" font-size="10"><text x="244" y="94">300</text><text x="244" y="134">200</text></g>
    <text x="140" y="203" text-anchor="middle" fill="#222">Marco de 4 esquinas, cruces cada separación</text>
    <text x="140" y="218" text-anchor="middle" fill="#222">y, con medias cruces, medias cruces y rótulos</text>
    <text x="140" y="233" text-anchor="middle" fill="#222">de coordenadas en el borde.</text>
  </g>

  <!-- TRAZA -->
  <g transform="translate(280,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">TRAZA y RECORTA_TRAZA</text>
    <g transform="translate(30,150) rotate(-20)">
      <rect x="0" y="-25" width="80" height="50" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
      <rect x="80" y="-25" width="80" height="50" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
      <rect x="160" y="-25" width="80" height="50" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
      <line x1="0" y1="0" x2="234" y2="0" stroke="#222" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#flecha)"/>
    </g>
    <g fill="#1f5fa8" font-size="12" font-weight="bold" text-anchor="middle">
      <text x="64" y="130">H1</text><text x="139" y="103">H2</text><text x="214" y="76">H3</text>
    </g>
    <text x="140" y="203" text-anchor="middle" fill="#222">Marcos de largo × alto sobre el eje (discontinuo),</text>
    <text x="140" y="218" text-anchor="middle" fill="#222">con un texto prefijo + número + sufijo. RECORTA_</text>
    <text x="140" y="233" text-anchor="middle" fill="#222">TRAZA crea una hoja por marco con ese nombre.</text>
  </g>

  <!-- DESPLAZAR_ORIGEN -->
  <g transform="translate(560,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DESPLAZAR_ORIGEN</text>
    <polygon points="50,160 60,70 160,50 240,110 190,170" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2.5"/>
    <circle cx="50" cy="160" r="5" fill="#fff" stroke="#999" stroke-width="2"/>
    <text x="28" y="182" fill="#777">origen anterior</text>
    <use href="#cruzRoja" x="240" y="110"/>
    <circle cx="240" cy="110" r="5" fill="#e67e22"/>
    <text x="238" y="135" text-anchor="end" fill="#e67e22">origen nuevo</text>
    <text x="150" y="98" text-anchor="middle" fill="#555">+ / − mueven la cruz</text>
    <text x="150" y="114" text-anchor="middle" fill="#555">espacio la acepta</text>
    <text x="140" y="203" text-anchor="middle" fill="#222">La línea cerrada empieza y termina en el</text>
    <text x="140" y="218" text-anchor="middle" fill="#222">vértice de la cruz. La geometría no cambia.</text>
  </g>

  <line x1="20" y1="252" x2="820" y2="252" stroke="#ddd"/>

  <!-- EJE_A_POLIGONO -->
  <g transform="translate(0,262)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">EJE_A_POLIGONO</text>
    <polygon points="50.8,154.4 123.9,99.6 235.6,127.5 244.4,92.5 116.1,60.4 29.2,125.6" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2.5"/>
    <polyline points="40,140 120,80 240,110" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="180" y1="95" x2="175.6" y2="112.5" stroke="#c0392b" stroke-width="1.5"/>
    <text x="182" y="120" fill="#c0392b">DA</text>
    <text x="140" y="203" text-anchor="middle" fill="#222">Polígono a la distancia DA a ambos lados</text>
    <text x="140" y="218" text-anchor="middle" fill="#222">del eje (discontinuo). Con un eje cerrado,</text>
    <text x="140" y="233" text-anchor="middle" fill="#222">un polígono con un hueco.</text>
  </g>

  <!-- SIGUIENTE_SEGMENTO_VERTICAL_HACIA_ABAJO -->
  <g transform="translate(280,262)">
    <text x="140" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SIGUIENTE_SEGMENTO_</text>
    <text x="140" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">VERTICAL_HACIA_ABAJO</text>
    <line x1="30" y1="175" x2="30" y2="45" stroke="#bbb"/><text x="22" y="55" fill="#999" text-anchor="end">Z</text>
    <polyline points="40,60 70,60" fill="none" stroke="#999" stroke-width="2.5"/>
    <polyline points="70,60 70,150 230,150" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <circle cx="70" cy="60" r="4" fill="#555"/><text x="78" y="56" fill="#555">último vértice</text>
    <circle cx="70" cy="150" r="4.5" fill="#e67e22"/>
    <use href="#p1" x="230" y="150"/>
    <text x="140" y="203" text-anchor="middle" fill="#222">Vista en alzado. Al digitalizar 1 se añaden</text>
    <text x="140" y="218" text-anchor="middle" fill="#222">dos vértices: primero el vertical, con la XY del</text>
    <text x="140" y="233" text-anchor="middle" fill="#222">último vértice y la Z de 1, y después 1.</text>
  </g>

  <!-- SIGUIENTE_SEGMENTO_VERTICAL_HACIA_ARRIBA -->
  <g transform="translate(560,262)">
    <text x="140" y="16" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SIGUIENTE_SEGMENTO_</text>
    <text x="140" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">VERTICAL_HACIA_ARRIBA</text>
    <line x1="30" y1="175" x2="30" y2="45" stroke="#bbb"/><text x="22" y="55" fill="#999" text-anchor="end">Z</text>
    <polyline points="40,150 70,150" fill="none" stroke="#999" stroke-width="2.5"/>
    <polyline points="70,150 230,150 230,60" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <circle cx="70" cy="150" r="4" fill="#555"/><text x="62" y="168" fill="#555">último vértice</text>
    <circle cx="230" cy="150" r="4.5" fill="#e67e22"/>
    <use href="#p1" x="230" y="60"/>
    <text x="140" y="203" text-anchor="middle" fill="#222">Al digitalizar 1 se añaden dos vértices:</text>
    <text x="140" y="218" text-anchor="middle" fill="#222">primero uno con la XY de 1 y la Z del último</text>
    <text x="140" y="233" text-anchor="middle" fill="#222">vértice, y después 1, que queda en vertical.</text>
  </g>

  <rect x="20" y="508" width="800" height="44" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#cruz" x="40" y="530"/>
  <text x="54" y="534" fill="#222">Cruz de hoja.</text>
  <circle cx="160" cy="530" r="4.5" fill="#e67e22"/>
  <text x="172" y="534" fill="#222">Vértice que añade o cambia la orden.</text>
  <use href="#p1" x="430" y="530"/>
  <text x="444" y="534" fill="#222">Punto digitalizado.</text>
  <line x1="580" y1="530" x2="610" y2="530" stroke="#222" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="618" y="534" fill="#222">Eje seleccionado.</text>
</svg>
