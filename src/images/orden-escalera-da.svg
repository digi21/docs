<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
    <g id="p4"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4</text></g>
  </defs>
  <rect width="480" height="420" fill="#ffffff"/>

  <text x="240" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ESCALERA_DA</text>

  <g stroke="#1f5fa8" stroke-width="2">
    <line x1="120" y1="275" x2="180" y2="65"/><line x1="330" y1="275" x2="390" y2="65"/>
    <line x1="120" y1="275" x2="330" y2="275"/>
    <line x1="133.65" y1="227.45" x2="343.65" y2="227.45"/>
    <line x1="147.3" y1="179.9" x2="357.3" y2="179.9"/>
    <line x1="160.95" y1="132.35" x2="370.95" y2="132.35"/>
    <line x1="174.6" y1="84.8" x2="384.6" y2="84.8"/>
  </g>
  <g stroke="#e67e22" stroke-width="2">
    <line x1="102" y1="275" x2="115.65" y2="227.45"/>
    <line x1="97" y1="273.6" x2="107" y2="276.4"/><line x1="110.65" y1="226.05" x2="120.65" y2="228.85"/>
  </g>
  <text x="102" y="256" text-anchor="end" fill="#e67e22" font-weight="bold">DA</text>
  <use href="#p1" x="120" y="275"/>
  <use href="#p2" x="180" y="65"/>
  <use href="#p3" x="390" y="65"/>
  <use href="#p4" x="330" y="275"/>

  <text x="240" y="312" text-anchor="middle" fill="#222">1→2 y 4→3: los dos laterales. La orden traza un peldaño</text>
  <text x="240" y="329" text-anchor="middle" fill="#222">en 1-4 y otro cada DA, medida sobre cada lateral, mientras</text>
  <text x="240" y="346" text-anchor="middle" fill="#222">quepa en el lateral más corto. Los laterales también se añaden.</text>

  <rect x="15" y="372" width="450" height="34" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="34" y="389"/>
  <text x="50" y="394" fill="#222">Puntos digitalizados, en orden.</text>
  <line x1="250" y1="389" x2="276" y2="389" stroke="#e67e22" stroke-width="2"/>
  <text x="284" y="394" fill="#222">DA: distancia activa.</text>
</svg>
