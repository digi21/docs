<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="440" height="320" fill="#ffffff"/>

  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ACUERDO</text>

  <g transform="translate(60,0)">
    <polyline points="128.2,104.3 160,70 193.1,103.1" fill="none" stroke="#aaa" stroke-dasharray="5 4"/>
    <polyline points="30,210 128.2,104.3" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <path d="M 128.2 104.3 A 45 45 0 0 1 193.1 103.1" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <polyline points="193.1,103.1 290,200" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="161.2" y1="134.9" x2="193.1" y2="103.1" stroke="#e67e22" stroke-width="1.5"/>
    <text x="182" y="132" fill="#e67e22" font-weight="bold">radio</text>
    <circle cx="161.2" cy="134.9" r="3" fill="#e67e22"/>
    <text x="160" y="58" text-anchor="middle" fill="#888">vértice original</text>
    <circle cx="128.2" cy="104.3" r="4" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
    <circle cx="193.1" cy="103.1" r="4" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
  </g>

  <text x="220" y="236" text-anchor="middle" fill="#222">El vértice más cercano al punto de selección se sustituye</text>
  <text x="220" y="252" text-anchor="middle" fill="#222">por un arco tangente a sus dos tramos. El radio se escribe</text>
  <text x="220" y="268" text-anchor="middle" fill="#222">en la barra de estado o se mide con dos puntos.</text>

  <rect x="20" y="282" width="400" height="30" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <circle cx="40" cy="297" r="4" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="52" y="302" fill="#222">Puntos de tangencia.</text>
  <line x1="200" y1="297" x2="230" y2="297" stroke="#aaa" stroke-dasharray="5 4"/>
  <text x="238" y="302" fill="#222">Tramos originales.</text>
</svg>
