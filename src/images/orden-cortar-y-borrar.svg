<svg xmlns="http://www.w3.org/2000/svg" width="480" height="384" viewBox="0 0 480 384" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="384" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">CORTAR_Y_BORRAR</text>

  <polyline points="60,220 170,120 270,138.3" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="270,138.3 400,162" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="270" cy="138.3" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <use href="#p1" x="270" y="104"/>
  <line x1="270" y1="114" x2="270" y2="130" stroke="#c0392b" stroke-width="2"/>
  <use href="#p2" x="342" y="186"/>
  <line x1="342" y1="176" x2="342" y2="157" stroke="#c0392b" stroke-width="2"/>

  <text x="240" y="256" text-anchor="middle" fill="#222">1: punto donde se parte la línea.</text>
  <text x="240" y="274" text-anchor="middle" fill="#222">2: selección de uno de los dos trozos.</text>
  <text x="240" y="292" text-anchor="middle" fill="#222">El trozo seleccionado se borra.</text>

  <rect x="16" y="314" width="448" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="332"/>
  <text x="60" y="336" fill="#222">Selección, en orden.</text>
  <circle cx="268" cy="332" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="294" y="336" fill="#222">Punto de corte.</text>
  <line x1="26" y1="354" x2="62" y2="354" stroke="#1f5fa8" stroke-width="3"/>
  <text x="70" y="358" fill="#222">Trozo que queda.</text>
  <line x1="250" y1="354" x2="286" y2="354" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="294" y="358" fill="#222">Trozo que se borra.</text>
</svg>
