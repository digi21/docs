  <text x="220" y="246" text-anchor="middle" fill="#222">Un cuadro de diálogo pide el símbolo. Los símbolos ocupan los nudos</text>
  <text x="220" y="261" text-anchor="middle" fill="#222">de una retícula girada según AA: separados por la distancia activa</text>
  <text x="220" y="276" text-anchor="middle" fill="#222">principal en la dirección de AA y por la secundaria en la perpendicular.</text>
  <text x="220" y="291" text-anchor="middle" fill="#222">Cada símbolo es un texto con el código activo, altura AT, justificación</text>
  <text x="220" y="306" text-anchor="middle" fill="#222">JT y giro AA. Solo se añaden los símbolos interiores.</text>
