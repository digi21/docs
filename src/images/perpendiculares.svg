<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="tramo">
      <line x1="30" y1="190" x2="170" y2="190" stroke="#1f5fa8" stroke-width="4"/>
      <line x1="170" y1="190" x2="265" y2="190" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="30" cy="190" r="4" fill="#1f5fa8"/><circle cx="170" cy="190" r="4" fill="#1f5fa8"/>
      <text x="100" y="210" text-anchor="middle" fill="#1f5fa8">tramo seleccionado</text>
    </g>
  </defs>
  <rect width="840" height="350" fill="#ffffff"/>

  <!-- PERP y PERP_Z -->
  <g transform="translate(0,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">PERP y PERP_Z</text>
    <use href="#tramo"/>
    <polyline points="110,190 110,90" fill="none" stroke="#e67e22" stroke-width="3"/>
    <polyline points="110,90 200,55 250,80" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="7 5"/>
    <polyline points="110,178 122,178 122,190" fill="none" stroke="#555"/>
    <circle cx="110" cy="190" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <text x="96" y="182" fill="#555" text-anchor="end">pie</text>
    <use href="#p1" x="110" y="90"/>
    <text x="215" y="45" fill="#e67e22">sigue con LINEA</text>
    <text x="140" y="250" text-anchor="middle" fill="#222">La nueva polilínea empieza en el pie de la</text>
    <text x="140" y="266" text-anchor="middle" fill="#222">perpendicular, pasa por 1 y continúa.</text>
    <text x="140" y="290" text-anchor="middle" fill="#222">Z del pie: PERP, la del punto 1;</text>
    <text x="140" y="306" text-anchor="middle" fill="#222">PERP_Z, la del tramo.</text>
  </g>

  <!-- PERP_A -->
  <g transform="translate(280,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">PERP_A</text>
    <use href="#tramo"/>
    <line x1="70" y1="90" x2="70" y2="190" stroke="#e67e22" stroke-width="3"/>
    <line x1="230" y1="110" x2="230" y2="190" stroke="#e67e22" stroke-width="3"/>
    <polyline points="70,178 82,178 82,190" fill="none" stroke="#555"/>
    <polyline points="230,178 242,178 242,190" fill="none" stroke="#555"/>
    <circle cx="70" cy="190" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <circle cx="230" cy="190" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <use href="#p1" x="70" y="90"/>
    <use href="#p2" x="230" y="110"/>
    <text x="140" y="250" text-anchor="middle" fill="#222">Cada punto genera un segmento hasta el pie.</text>
    <text x="140" y="266" text-anchor="middle" fill="#222">El pie puede caer en la prolongación (2).</text>
    <text x="140" y="290" text-anchor="middle" fill="#222">Z del pie: la del punto;</text>
    <text x="140" y="306" text-anchor="middle" fill="#222">con PERP_A=1, la del tramo.</text>
  </g>

  <!-- MIDE_PERP -->
  <g transform="translate(560,0)">
    <text x="140" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">MIDE_PERP</text>
    <use href="#tramo"/>
    <line x1="120" y1="80" x2="120" y2="190" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polyline points="120,178 132,178 132,190" fill="none" stroke="#555"/>
    <text x="128" y="140" fill="#555" font-weight="bold">d</text>
    <use href="#p1" x="120" y="80"/>
    <text x="140" y="250" text-anchor="middle" fill="#222">Muestra la distancia d en planta del</text>
    <text x="140" y="266" text-anchor="middle" fill="#222">punto 1 a la recta del tramo. No dibuja nada.</text>
    <text x="140" y="290" text-anchor="middle" fill="#222">Si la orden anterior espera una distancia</text>
    <text x="140" y="306" text-anchor="middle" fill="#222">(por ejemplo PARALELA), se la pasa.</text>
  </g>

  <rect x="20" y="320" width="800" height="26" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="333"/>
  <text x="56" y="338" fill="#222">Puntos digitalizados.</text>
  <line x1="220" y1="333" x2="260" y2="333" stroke="#e67e22" stroke-width="3"/>
  <text x="270" y="338" fill="#222">Entidad que se crea.</text>
  <circle cx="440" cy="333" r="4" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="452" y="338" fill="#222">Pie de la perpendicular sobre la recta del tramo.</text>
</svg>
