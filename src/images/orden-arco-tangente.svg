<svg xmlns="http://www.w3.org/2000/svg" width="440" height="340" viewBox="0 0 440 340" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="v"><circle r="5" fill="#1f5fa8"/></g>
  </defs>
  <rect width="440" height="340" fill="#ffffff"/>

  <text x="220" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ARCO_TANGENTE</text>

  <g transform="translate(60,0)">
    <polyline points="30,200 80,120 150,120" fill="none" stroke="#1f5fa8" stroke-width="3"/>
    <line x1="150" y1="120" x2="230" y2="120" stroke="#888" stroke-dasharray="5 4"/>
    <text x="236" y="124" fill="#888">tangente</text>
    <path d="M 150 120 A 50 50 0 0 1 193.3 195" fill="none" stroke="#e67e22" stroke-width="3"/>
    <use href="#v" x="30" y="200"/>
    <use href="#v" x="80" y="120"/>
    <use href="#v" x="150" y="120"/>
    <text x="150" y="108" text-anchor="middle" fill="#1f5fa8">último vértice</text>
    <use href="#p1" x="193.3" y="195"/>
  </g>

  <text x="220" y="238" text-anchor="middle" fill="#222">Durante una línea con dos vértices o más: el arco</text>
  <text x="220" y="254" text-anchor="middle" fill="#222">sale del último vértice, tangente al último tramo, y</text>
  <text x="220" y="270" text-anchor="middle" fill="#222">termina en el punto 1. Sus vértices se añaden a la línea.</text>

  <rect x="20" y="284" width="400" height="48" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="40" y="300"/>
  <text x="56" y="305" fill="#222">Punto digitalizado.</text>
  <use href="#v" x="40" y="320"/>
  <text x="56" y="325" fill="#222">Vértices de la línea en curso.</text>
  <line x1="252" y1="300" x2="282" y2="300" stroke="#1f5fa8" stroke-width="3"/>
  <text x="290" y="305" fill="#222">Línea en curso.</text>
  <line x1="252" y1="320" x2="282" y2="320" stroke="#e67e22" stroke-width="3"/>
  <text x="290" y="325" fill="#222">Arco tangente.</text>
</svg>
