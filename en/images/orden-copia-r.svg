<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <g id="p1"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text></g>
    <g id="p2"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text></g>
    <g id="p3"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text></g>
    <g id="p4"><circle r="8" fill="#c0392b"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">4</text></g>
  </defs>
  <rect width="460" height="330" fill="#ffffff"/>

  <text x="230" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">COPY_R</text>

  <g transform="translate(20,-20)">
    <polygon points="50,170 90,170 90,145 70,130 50,145" fill="#eee" stroke="#999" stroke-width="2"/>
    <g transform="translate(250,140) rotate(-30)">
      <polygon points="0,0 40,0 40,-25 20,-40 0,-25" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2.5"/>
    </g>
    <line x1="50" y1="170" x2="250" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="250" y1="140" x2="345.3" y2="85" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <line x1="250" y1="140" x2="340" y2="140" stroke="#999" stroke-width="1"/>
    <text x="346" y="144" fill="#888">east</text>
    <path d="M 300 140 A 50 50 0 0 0 293.3 115" fill="none" stroke="#555"/>
    <text x="304" y="130" fill="#555">rotation</text>
    <use href="#p1" x="90" y="158"/>
    <use href="#p2" x="50" y="170"/>
    <use href="#p3" x="250" y="140"/>
    <use href="#p4" x="345.3" y="85"/>
  </g>

  <text x="230" y="186" text-anchor="middle" fill="#222">1: select entity. 2: base point. 3: base point destination.</text>
  <text x="230" y="201" text-anchor="middle" fill="#222">4: direction 3-4, counterclockwise from east, gives the</text>
  <text x="230" y="216" text-anchor="middle" fill="#222">copy rotation. With 4 east of 3, it does not rotate; with 4</text>
  <text x="230" y="231" text-anchor="middle" fill="#222">north of 3, it rotates 90&#176;. Copied text and points rotate</text>
  <text x="230" y="246" text-anchor="middle" fill="#222">by the same angle.</text>

  <rect x="20" y="262" width="420" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="38" y="282"/>
  <text x="52" y="286" fill="#222">Digitized points, in order.</text>
  <polygon points="250,292 270,292 270,280 260,274 250,280" fill="#eee" stroke="#999" stroke-width="1.5"/>
  <text x="278" y="288" fill="#222">Original entity.</text>
  <polygon points="250,312 270,312 270,300 260,294 250,300" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="1.5" transform="translate(0,2)"/>
  <text x="278" y="310" fill="#222">Copy.</text>
</svg>
