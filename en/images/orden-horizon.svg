<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="520" height="440" fill="#ffffff"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">HORIZON</text>

  <!-- Ancho = 0 -->
  <text x="20" y="58" fill="#555">Width = 0</text>
  <line x1="70" y1="82" x2="485" y2="82" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flechaGris)"/>
  <g stroke="#1f5fa8" stroke-width="3">
    <line x1="70" y1="82" x2="130" y2="82"/><line x1="160" y1="82" x2="220" y2="82"/>
    <line x1="250" y1="82" x2="310" y2="82"/><line x1="340" y1="82" x2="400" y2="82"/>
  </g>
  <line x1="430" y1="82" x2="475" y2="82" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="452" y="72" text-anchor="middle" fill="#c0392b" font-size="11">omitted</text>
  <line x1="70" y1="94" x2="130" y2="94" stroke="#555"/><text x="100" y="108" text-anchor="middle" fill="#555">length</text>
  <line x1="130" y1="94" x2="160" y2="94" stroke="#c0392b"/><text x="145" y="108" text-anchor="middle" fill="#c0392b">gap</text>

  <!-- Ancho > 0 -->
  <text x="20" y="134" fill="#555">Width &gt; 0: dashes to the right</text>
  <line x1="70" y1="150" x2="485" y2="150" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flechaGris)"/>
  <g fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2">
    <rect x="70" y="150" width="60" height="16"/><rect x="160" y="150" width="60" height="16"/>
    <rect x="250" y="150" width="60" height="16"/><rect x="340" y="150" width="60" height="16"/>
  </g>
  <rect x="430" y="150" width="45" height="16" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="62" y1="150" x2="62" y2="166" stroke="#555"/><text x="58" y="163" text-anchor="end" fill="#555">width</text>

  <!-- Ancho < 0 -->
  <text x="20" y="204" fill="#555">Width &lt; 0: dashes to the left</text>
  <line x1="70" y1="238" x2="485" y2="238" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flechaGris)"/>
  <g fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2">
    <rect x="70" y="222" width="60" height="16"/><rect x="160" y="222" width="60" height="16"/>
    <rect x="250" y="222" width="60" height="16"/><rect x="340" y="222" width="60" height="16"/>
  </g>
  <rect x="430" y="222" width="45" height="16" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="62" y1="222" x2="62" y2="238" stroke="#555"/><text x="58" y="235" text-anchor="end" fill="#555">|width|</text>

  <text x="260" y="276" text-anchor="middle" fill="#222">Replace each visible open line of the code with dashes</text>
  <text x="260" y="293" text-anchor="middle" fill="#222">of the given length and spacing, from the first vertex.</text>
  <text x="260" y="310" text-anchor="middle" fill="#222">Zero width gives open lines. Other widths give closed</text>
  <text x="260" y="327" text-anchor="middle" fill="#222">lines offset by that width from the digitizing direction.</text>
  <text x="260" y="344" text-anchor="middle" fill="#222">Length &gt; 0; gap ≥ 0. Omit any final incomplete dash.</text>

  <rect x="15" y="362" width="490" height="66" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="30" y1="379" x2="60" y2="379" stroke="#aaa" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#flechaGris)"/>
  <text x="70" y="383" fill="#222">Original line. Arrow shows the digitizing direction.</text>
  <line x1="30" y1="397" x2="60" y2="397" stroke="#1f5fa8" stroke-width="3"/>
  <text x="70" y="401" fill="#222">Generated dashes. The original line is deleted.</text>
  <line x1="30" y1="415" x2="60" y2="415" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="70" y="419" fill="#222">Incomplete dash at the line end: omitted.</text>
</svg>
