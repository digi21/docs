<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="nodo"><circle r="6.5" fill="#fff" stroke="#222" stroke-width="2"/></g>
  </defs>
  <rect width="480" height="470" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ASSIGN_MAX_Z_NODE_VERTICES</text>

  <polyline points="60,70 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="420,90 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <polyline points="180,330 240,170" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <use href="#nodo" x="240" y="170"/>

  <text x="140" y="96" fill="#d35400" font-size="12">z 100 → 102</text>
  <text x="300" y="172" fill="#d35400" font-size="12">z 101.5 → 102</text>
  <text x="232" y="262" fill="#555" font-size="12">z 102 (maximum)</text>

  <text x="240" y="364" text-anchor="middle" fill="#222">Node: point where the ends of two or more lines or</text>
  <text x="240" y="382" text-anchor="middle" fill="#222">polygons with the specified codes share X and Y.</text>
  <text x="240" y="400" text-anchor="middle" fill="#222">All ends at the node take its maximum Z (here, 102).</text>

  <rect x="16" y="418" width="448" height="42" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#nodo" x="36" y="439"/>
  <text x="50" y="443" fill="#222">Node.</text>
  <text x="140" y="443" fill="#d35400" font-size="12">z before → z after</text>
  <text x="262" y="443" fill="#222">Z of the end that changes.</text>
</svg>
