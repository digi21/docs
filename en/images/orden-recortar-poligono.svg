<svg xmlns="http://www.w3.org/2000/svg" width="480" height="450" viewBox="0 0 480 450" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="450" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">TRIM_POLYGON</text>

  <rect x="60" y="70" width="320" height="165" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
  <circle cx="360" cy="152" r="62" fill="#ffffff" stroke="none"/>
  <circle cx="360" cy="152" r="62" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="345" y="157" text-anchor="middle" fill="#c0392b">deleted</text>
  <use href="#p1" x="110" y="110"/>
  <use href="#p2" x="360" y="90"/>

  <text x="240" y="264" text-anchor="middle" fill="#222">1: polygon or closed line.</text>
  <text x="240" y="282" text-anchor="middle" fill="#222">2: boundary, a closed line or polygon.</text>
  <text x="240" y="300" text-anchor="middle" fill="#222">Remove the polygon portion inside the boundary.</text>
  <text x="240" y="318" text-anchor="middle" fill="#222">If the boundary divides it, retain several</text>
  <text x="240" y="336" text-anchor="middle" fill="#222">polygons with the same code.</text>
  <text x="240" y="354" text-anchor="middle" fill="#222">Any parameter also deletes the boundary.</text>

  <rect x="16" y="376" width="448" height="62" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="394"/>
  <text x="60" y="398" fill="#222">Selection, in order.</text>
  <line x1="250" y1="394" x2="286" y2="394" stroke="#444" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="294" y="398" fill="#222">Closed boundary.</text>
  <rect x="26" y="410" width="36" height="16" fill="#dbe7f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="70" y="422" fill="#222">Retained polygon.</text>
</svg>
