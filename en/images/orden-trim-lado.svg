<svg xmlns="http://www.w3.org/2000/svg" width="480" height="434" viewBox="0 0 480 434" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="434" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">TRIM_SIDE</text>

  <line x1="250" y1="55" x2="250" y2="235" stroke="#444" stroke-width="3"/>
  <g stroke="#1f5fa8" stroke-width="3">
    <line x1="90" y1="90" x2="250" y2="90"/>
    <line x1="90" y1="145" x2="250" y2="145"/>
    <line x1="90" y1="200" x2="250" y2="200"/>
  </g>
  <g stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4">
    <line x1="250" y1="90" x2="380" y2="90"/>
    <line x1="250" y1="145" x2="370" y2="145"/>
    <line x1="250" y1="200" x2="390" y2="200"/>
  </g>
  <use href="#p1" x="250" y="66"/>
  <use href="#p2" x="340" y="226"/>

  <text x="240" y="270" text-anchor="middle" fill="#222">1: boundary. 2: point digitized on one side.</text>
  <text x="240" y="288" text-anchor="middle" fill="#222">Split each visible line crossing the boundary at</text>
  <text x="240" y="306" text-anchor="middle" fill="#222">its intersections. Delete the portions on the side</text>
  <text x="240" y="324" text-anchor="middle" fill="#222">of point 2. Each new point repeats trimming with</text>
  <text x="240" y="342" text-anchor="middle" fill="#222">the same boundary until Esc is pressed.</text>

  <rect x="16" y="364" width="448" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="382"/>
  <text x="60" y="386" fill="#222">Selection or point, in order.</text>
  <line x1="250" y1="382" x2="286" y2="382" stroke="#444" stroke-width="3"/>
  <text x="294" y="386" fill="#222">Boundary.</text>
  <line x1="26" y1="404" x2="62" y2="404" stroke="#1f5fa8" stroke-width="3"/>
  <text x="70" y="408" fill="#222">Lines to trim.</text>
  <line x1="250" y1="404" x2="286" y2="404" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="294" y="408" fill="#222">Deleted portions.</text>
</svg>
