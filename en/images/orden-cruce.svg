<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="480" height="460" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">INTERSECTION</text>

  <line x1="40" y1="160" x2="140" y2="160" stroke="#444" stroke-width="3"/>
  <line x1="140" y1="160" x2="330" y2="160" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="330" y1="160" x2="440" y2="160" stroke="#444" stroke-width="3"/>
  <line x1="140" y1="60" x2="140" y2="132" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="140" y1="132" x2="140" y2="160" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="330" y1="60" x2="330" y2="160" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="330" y1="160" x2="330" y2="200" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="400" y="182" fill="#444">boundary</text>
  <use href="#p1" x="70" y="160"/>
  <use href="#p2" x="140" y="95"/>
  <use href="#p3" x="330" y="95"/>

  <text x="240" y="250" text-anchor="middle" fill="#222">1: boundary. 2 and 3: two approaching lines.</text>
  <text x="240" y="268" text-anchor="middle" fill="#222">Extend (2) or trim (3) each line to the boundary</text>
  <text x="240" y="286" text-anchor="middle" fill="#222">at the endpoint nearest the selection point.</text>
  <text x="240" y="304" text-anchor="middle" fill="#222">Split the boundary in two and remove the span</text>
  <text x="240" y="322" text-anchor="middle" fill="#222">between the intersections.</text>

  <rect x="16" y="344" width="448" height="102" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="362"/>
  <text x="60" y="366" fill="#222">Selection, in order.</text>
  <line x1="250" y1="362" x2="286" y2="362" stroke="#444" stroke-width="3"/>
  <text x="294" y="366" fill="#222">Boundary.</text>
  <line x1="26" y1="384" x2="62" y2="384" stroke="#1f5fa8" stroke-width="3"/>
  <text x="70" y="388" fill="#222">Lines 2 and 3.</text>
  <line x1="250" y1="384" x2="286" y2="384" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="294" y="388" fill="#222">Added extension.</text>
  <line x1="26" y1="406" x2="62" y2="406" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="70" y="410" fill="#222">Deleted portion: boundary span and line 3</text>
  <text x="70" y="428" fill="#222">overshoot.</text>
</svg>
