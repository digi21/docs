<svg xmlns="http://www.w3.org/2000/svg" width="520" height="580" viewBox="0 0 520 580" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <g id="cruz" stroke="#2e7d32" stroke-width="1.2"><line x1="-4" y1="0" x2="4" y2="0"/><line x1="0" y1="-4" x2="0" y2="4"/></g>
    <g id="archivo">
      <path d="M -50 -42 L 32 -42 L 50 -24 L 50 42 L -50 42 Z" fill="#fff" stroke="#888" stroke-width="1.5"/>
      <path d="M 32 -42 L 32 -24 L 50 -24" fill="none" stroke="#888" stroke-width="1.5"/>
      <g transform="rotate(-20)">
        <rect x="-32" y="-18" width="64" height="36" fill="none" stroke="#1f5fa8" stroke-width="2"/>
        <line x1="-27" y1="9" x2="27" y2="-4" stroke="#999" stroke-width="2"/>
      </g>
      <use href="#cruz" x="-12" y="4"/><use href="#cruz" x="12" y="-6"/>
    </g>
  </defs>
  <rect width="520" height="580" fill="#ffffff"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">TRIM_TRACE</text>

  <polyline points="30,170 120,200 210,120 300,150" fill="none" stroke="#999" stroke-width="2"/>
  <g transform="translate(50,200) rotate(-20)">
    <rect x="0" y="-26" width="84" height="52" fill="#eaf1fa" fill-opacity="0.6" stroke="#1f5fa8" stroke-width="2"/>
    <rect x="84" y="-26" width="84" height="52" fill="#eaf1fa" fill-opacity="0.6" stroke="#1f5fa8" stroke-width="2"/>
    <rect x="168" y="-26" width="84" height="52" fill="#eaf1fa" fill-opacity="0.6" stroke="#1f5fa8" stroke-width="2"/>
  </g>
  <g fill="#1f5fa8" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="89.5" y="192">H1</text><text x="168.4" y="163">H2</text><text x="247.3" y="134">H3</text>
  </g>
  <rect x="360" y="90" width="90" height="56" fill="#eaf1fa" fill-opacity="0.6" stroke="#1f5fa8" stroke-width="2"/>
  <text x="405" y="166" text-anchor="middle" fill="#555" font-size="12">Frame without text:</text>
  <text x="405" y="181" text-anchor="middle" fill="#555" font-size="12">skipped.</text>

  <line x1="250" y1="236" x2="250" y2="268" stroke="#555" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="262" y="257" fill="#555" font-size="12">one file per named frame</text>

  <use href="#archivo" x="100" y="325"/>
  <use href="#archivo" x="260" y="325"/>
  <use href="#archivo" x="420" y="325"/>
  <g fill="#222" text-anchor="middle" font-weight="bold">
    <text x="100" y="387">H1.bin</text><text x="260" y="387">H2.bin</text><text x="420" y="387">H3.bin</text>
  </g>

  <text x="260" y="420" text-anchor="middle" fill="#222">Find closed lines with the frame code and matching text</text>
  <text x="260" y="437" text-anchor="middle" fill="#222">inside each. For each named frame, create an output file</text>
  <text x="260" y="454" text-anchor="middle" fill="#222">using its text as the filename and the given extension.</text>
  <text x="260" y="471" text-anchor="middle" fill="#222">Four-corner frames produce the same content as SHEET.</text>
  <text x="260" y="488" text-anchor="middle" fill="#222">Other frames produce only clipped entities.</text>
  <text x="260" y="505" text-anchor="middle" fill="#222"></text>

  <rect x="15" y="522" width="490" height="48" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <rect x="30" y="531" width="22" height="13" fill="#eaf1fa" stroke="#1f5fa8" stroke-width="2"/>
  <text x="60" y="542" fill="#222">Frame: closed line with the frame code.</text>
  <text x="41" y="563" text-anchor="middle" fill="#1f5fa8" font-weight="bold">H1</text>
  <text x="60" y="562" fill="#222">Frame text.</text>
  <line x1="200" y1="558" x2="228" y2="558" stroke="#999" stroke-width="2"/>
  <text x="236" y="562" fill="#222">Drawing entity.</text>
  <use href="#cruz" x="370" y="558"/>
  <text x="382" y="562" fill="#222">Cross.</text>
</svg>
