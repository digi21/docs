<svg xmlns="http://www.w3.org/2000/svg" width="480" height="416" viewBox="0 0 480 416" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
  </defs>
  <rect width="480" height="416" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SPR_XYZ</text>

  <line x1="330" y1="55" x2="330" y2="235" stroke="#444" stroke-width="3"/>
  <circle cx="330" cy="55" r="4" fill="#444"/>
  <circle cx="330" cy="235" r="4" fill="#444"/>
  <text x="340" y="62" fill="#444">z = 110</text>
  <text x="340" y="239" fill="#444">z = 100</text>
  <line x1="60" y1="145" x2="250" y2="145" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="250" y1="145" x2="330" y2="145" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="330" cy="145" r="6" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="340" y="150" fill="#e67e22">z = 105</text>
  <use href="#p1" x="330" y="200"/>
  <use href="#p2" x="220" y="145"/>

  <text x="240" y="270" text-anchor="middle" fill="#222">1: boundary. 2: line, near the endpoint to move.</text>
  <text x="240" y="288" text-anchor="middle" fill="#222">Extend or trim the line to the boundary. The</text>
  <text x="240" y="306" text-anchor="middle" fill="#222">moved endpoint takes the boundary Z at the</text>
  <text x="240" y="324" text-anchor="middle" fill="#222">intersection, interpolated along its segment.</text>

  <rect x="16" y="346" width="448" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="364"/>
  <text x="60" y="368" fill="#222">Selection, in order.</text>
  <line x1="250" y1="364" x2="286" y2="364" stroke="#444" stroke-width="3"/>
  <text x="294" y="368" fill="#222">Boundary.</text>
  <line x1="26" y1="386" x2="62" y2="386" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="70" y="390" fill="#222">Added extension.</text>
  <circle cx="268" cy="386" r="6" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <text x="294" y="390" fill="#222">Endpoint with the boundary Z.</text>
</svg>
