<svg xmlns="http://www.w3.org/2000/svg" width="480" height="426" viewBox="0 0 480 426" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="eje" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="tramo">
      <line x1="30" y1="190" x2="170" y2="190" stroke="#1f5fa8" stroke-width="4"/>
      <line x1="170" y1="190" x2="265" y2="190" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="30" cy="190" r="4" fill="#1f5fa8"/><circle cx="170" cy="190" r="4" fill="#1f5fa8"/>
      <text x="100" y="210" text-anchor="middle" fill="#1f5fa8">selected segment</text>
      <text x="218" y="210" text-anchor="middle" fill="#1f5fa8" font-size="12">extension</text>
    </g>
  </defs>  <rect width="480" height="426" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">MEASURE_PERP</text>

  <text x="20" y="56" font-weight="bold" fill="#555">Plan view</text>
  <g transform="translate(90,20)">
    <use href="#tramo"/>
    <line x1="120" y1="80" x2="120" y2="190" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polyline points="120,178 132,178 132,190" fill="none" stroke="#555"/>
    <text x="128" y="140" fill="#555" font-weight="bold">d</text>
    <use href="#p1" x="120" y="80"/>
  </g>
  <text x="240" y="262" text-anchor="middle" fill="#222">Select a segment and digitize point 1. The command shows</text>
  <text x="240" y="278" text-anchor="middle" fill="#222">plan distance d from the point to the segment line.</text>
  <text x="240" y="294" text-anchor="middle" fill="#222">Nothing is drawn. If the active command expects</text>
  <text x="240" y="310" text-anchor="middle" fill="#222">a distance (for example, PARALLEL), it receives d.</text>

  <rect x="16" y="334" width="448" height="78" rx="6" fill="#f3f6fa" stroke="#c9d6e6"/>
  <line x1="32" y1="351" x2="72" y2="351" stroke="#1f5fa8" stroke-width="4"/>
  <text x="86" y="355.5" fill="#222">Selected segment (dashed: its extension).</text>
  <use href="#p1" x="52" y="373"/>
  <text x="86" y="377.5" fill="#222">Digitized point.</text>
  <line x1="32" y1="395" x2="72" y2="395" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="86" y="399.5" fill="#222">Temporary line from projection to cursor; not saved.</text>
</svg>
