<svg xmlns="http://www.w3.org/2000/svg" width="480" height="434" viewBox="0 0 480 434" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <g id="p1"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="p2"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="p3"><circle r="9" fill="#c0392b"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>
  <rect width="480" height="434" fill="#ffffff"/>
  <text x="240" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SPR</text>

  <line x1="330" y1="55" x2="330" y2="235" stroke="#444" stroke-width="3"/>
  <text x="338" y="232" fill="#444">boundary</text>
  <line x1="60" y1="100" x2="250" y2="100" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="250" y1="100" x2="330" y2="100" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="60" y1="185" x2="330" y2="185" stroke="#1f5fa8" stroke-width="3"/>
  <line x1="330" y1="185" x2="410" y2="185" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <use href="#p1" x="330" y="72"/>
  <use href="#p2" x="220" y="100"/>
  <use href="#p3" x="290" y="185"/>

  <text x="240" y="270" text-anchor="middle" fill="#222">1: boundary. 2, 3…: lines to extend (2) or trim (3)</text>
  <text x="240" y="288" text-anchor="middle" fill="#222">to the boundary, using the endpoint nearest</text>
  <text x="240" y="306" text-anchor="middle" fill="#222">the selection point.</text>
  <text x="240" y="324" text-anchor="middle" fill="#222">Line endpoint Z values remain unchanged.</text>
  <text x="240" y="342" text-anchor="middle" fill="#222">Keep using the same boundary until Esc is pressed.</text>

  <rect x="16" y="364" width="448" height="58" rx="5" fill="#f3f6fa" stroke="#c9d6e6"/>
  <use href="#p1" x="44" y="382"/>
  <text x="60" y="386" fill="#222">Selection, in order.</text>
  <line x1="250" y1="382" x2="286" y2="382" stroke="#444" stroke-width="3"/>
  <text x="294" y="386" fill="#222">Boundary.</text>
  <line x1="26" y1="404" x2="62" y2="404" stroke="#e67e22" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="70" y="408" fill="#222">Added extension.</text>
  <line x1="250" y1="404" x2="286" y2="404" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="294" y="408" fill="#222">Trimmed portion.</text>
</svg>
